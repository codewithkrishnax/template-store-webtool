<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mockup Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #e5e7eb; 
        }
        .app-container {
            height: 100dvh; 
        }
        .canvas-bg {
            background-color: #f3f4f6;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 24px 24px;
        }
        input[type="text"] {
            -webkit-appearance: none;
            border-radius: 0;
        }
        /* Hide scrollbars */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans antialiased overflow-hidden flex justify-center">

    <div class="app-container flex flex-col w-full max-w-md bg-white shadow-2xl relative">
        
        <header class="flex items-center justify-between px-5 py-4 border-b border-gray-100 shrink-0 bg-white z-10 shadow-sm">
            <div>
                <h1 class="text-lg font-black tracking-tight text-gray-900">Mockup Studio</h1>
                <p class="text-[10px] text-gray-500 font-bold mt-0.5 uppercase tracking-widest">Browser Frame</p>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto hide-scroll canvas-bg p-5 flex flex-col items-center relative">
            
            <div id="loadingState" class="hidden absolute inset-0 bg-white/70 backdrop-blur-sm z-30 flex flex-col items-center justify-center">
                <i class="ph ph-spinner-gap text-4xl text-gray-900 animate-spin mb-3"></i>
                <p class="text-sm font-bold text-gray-900 tracking-wide">Rendering HD Mockup...</p>
                <p class="text-xs text-gray-500 mt-1">Please wait a moment</p>
            </div>

            <div id="export-node" class="w-full max-w-sm bg-white rounded-xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.15)] border border-gray-200/50 overflow-hidden transition-all duration-300">
                
                <div id="header-macos" class="px-4 py-3 bg-white border-b border-gray-100 flex items-center justify-between relative">
                    <div class="flex gap-1.5 z-10 shrink-0">
                        <div class="w-2.5 h-2.5 rounded-full bg-[#FF5F56]"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-[#FFBD2E]"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-[#27C93F]"></div>
                    </div>
                    
                    <div class="absolute inset-x-0 mx-auto w-1/2 bg-gray-50 border border-gray-100 rounded-md py-1 px-2 flex items-center justify-center gap-1.5">
                        <svg width="10" height="10" viewBox="0 0 256 256" fill="#9ca3af" class="shrink-0"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-80-64a16,16,0,1,1,16-16A16,16,0,0,1,128,144Z"></path></svg>
                        <input type="text" class="url-input bg-transparent border-none outline-none text-[10px] font-medium text-gray-500 text-center w-full focus:text-gray-900" value="your-site.com" oninput="syncUrls(this.value)">
                    </div>
                </div>

                <div id="header-windows" class="hidden px-3 py-2.5 bg-[#f1f3f4] border-b border-gray-200 flex items-center gap-3">
                    <div class="flex items-center gap-3 text-gray-500 shrink-0">
                        <svg width="12" height="12" viewBox="0 0 256 256" fill="#6b7280"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
                        <svg width="12" height="12" viewBox="0 0 256 256" fill="#6b7280"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>
                        <svg width="12" height="12" viewBox="0 0 256 256" fill="#6b7280"><path d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11.08-11.53A80,80,0,1,0,73.53,71.11V48a8,8,0,0,1,16,0V96a8,8,0,0,1-8,8H32a8,8,0,0,1,0-16H60.43A95.73,95.73,0,0,1,128,32h1.29A96,96,0,0,1,224,128Z"></path></svg>
                    </div>
                    
                    <div class="flex-1 bg-white border border-gray-200 rounded-full py-1.5 px-3 flex items-center gap-1.5 shadow-sm">
                        <svg width="10" height="10" viewBox="0 0 256 256" fill="#9ca3af" class="shrink-0"><path d="M208,80H176V56a48,48,0,0,0-96,0V80H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM96,56a32,32,0,0,1,64,0V80H96ZM208,208H48V96H208V208Zm-80-64a16,16,0,1,1,16-16A16,16,0,0,1,128,144Z"></path></svg>
                        <input type="text" class="url-input bg-transparent border-none outline-none text-[10px] font-medium text-gray-700 w-full focus:text-gray-900" value="your-site.com" oninput="syncUrls(this.value)">
                    </div>
                    
                    <div class="flex gap-1 shrink-0 text-gray-500">
                        <svg width="14" height="14" viewBox="0 0 256 256" fill="#6b7280"><path d="M140,128a12,12,0,1,1-12-12A12,12,0,0,1,140,128ZM128,72a12,12,0,1,0-12-12A12,12,0,0,0,128,72Zm0,112a12,12,0,1,0,12,12A12,12,0,0,0,128,184Z"></path></svg>
                    </div>
                </div>

                <div id="image-wrapper" class="relative w-full bg-white overflow-hidden flex flex-col justify-center">
                    
                    <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-8 text-gray-400 min-h-[200px] relative">
                        <i class="ph ph-image-square text-4xl mb-2 opacity-50"></i>
                        <p class="text-xs font-medium">Tap 'Upload' below to begin</p>
                    </div>

                    <img id="mockupImage" src="" class="hidden w-full h-auto block" alt="Mockup content">
                </div>
            </div>
            <div class="h-8 w-full shrink-0"></div> </main>
        
        <div class="px-5 py-5 border-t border-gray-100 bg-white shrink-0 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] flex flex-col gap-5 z-20">
            
            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
            <button onclick="document.getElementById('fileInput').click()" class="w-full flex items-center justify-center gap-2 py-3.5 border-2 border-gray-200 hover:border-gray-900 bg-gray-50 active:bg-gray-100 rounded-xl text-sm font-bold text-gray-700 transition-colors">
                <i class="ph ph-upload-simple text-lg"></i>
                Upload Screenshot
            </button>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Browser Style</label>
                    <div class="flex p-1 bg-gray-100 rounded-lg">
                        <button onclick="setStyle('macos')" id="btn-macos" class="flex-1 py-1.5 text-xs font-bold rounded-md shadow-sm bg-white text-gray-900 transition-all">macOS</button>
                        <button onclick="setStyle('windows')" id="btn-windows" class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all">Windows</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Image Fit</label>
                    <div class="flex gap-1.5 p-1 bg-gray-100 rounded-lg">
                        <button onclick="setFit('auto')" id="btn-fit-auto" class="flex-1 py-1.5 text-xs font-bold rounded-md shadow-sm bg-white text-gray-900 transition-all">Auto</button>
                        <button onclick="setFit('fill')" id="btn-fit-fill" class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all">Fill</button>
                        <button onclick="setFit('contain')" id="btn-fit-contain" class="flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all">Contain</button>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Export Quality</label>
                <div class="flex gap-2">
                    <button onclick="setQuality('low')" id="btn-q-low" class="flex-1 py-2 text-xs font-bold rounded-lg border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 transition-all">Low</button>
                    <button onclick="setQuality('high')" id="btn-q-high" class="flex-1 py-2 text-xs font-bold rounded-lg border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 transition-all">High</button>
                    <button onclick="setQuality('4k')" id="btn-q-4k" class="flex-1 py-2 text-xs font-bold rounded-lg border-2 border-gray-900 bg-gray-900 text-white shadow-md transition-all">4K</button>
                </div>
            </div>

            <button onclick="exportMockup()" id="exportBtn" class="w-full flex items-center justify-center gap-2 py-4 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 rounded-xl text-[15px] font-bold text-white transition-colors shadow-lg shadow-blue-600/30">
                <i class="ph ph-download-simple text-xl"></i>
                Save Image
            </button>
        </div>

        <div class="pb-safe bg-white shrink-0"></div>
    </div>

    <script>
        const DOM = {
            btnMacos: document.getElementById('btn-macos'),
            btnWindows: document.getElementById('btn-windows'),
            headerMacos: document.getElementById('header-macos'),
            headerWindows: document.getElementById('header-windows'),
            imageWrapper: document.getElementById('image-wrapper'),
            mockupImage: document.getElementById('mockupImage'),
            placeholder: document.getElementById('placeholder'),
            exportNode: document.getElementById('export-node'),
            urlInputs: document.querySelectorAll('.url-input'),
            loadingState: document.getElementById('loadingState'),
            btnQLow: document.getElementById('btn-q-low'),
            btnQHigh: document.getElementById('btn-q-high'),
            btnQ4k: document.getElementById('btn-q-4k'),
            btnFitAuto: document.getElementById('btn-fit-auto'),
            btnFitFill: document.getElementById('btn-fit-fill'),
            btnFitContain: document.getElementById('btn-fit-contain'),
        };

        let hasImage = false;
        let exportQualityScale = 4; // Default to 4K

        // Sync URL text
        function syncUrls(value) {
            DOM.urlInputs.forEach(input => {
                if (input.value !== value) input.value = value;
            });
        }

        // Handle Style Toggle
        function setStyle(style) {
            const active = "flex-1 py-1.5 text-xs font-bold rounded-md shadow-sm bg-white text-gray-900 transition-all";
            const inactive = "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all";
            
            if (style === 'macos') {
                DOM.btnMacos.className = active;
                DOM.btnWindows.className = inactive;
                DOM.headerMacos.classList.remove('hidden');
                DOM.headerWindows.classList.add('hidden');
            } else {
                DOM.btnWindows.className = active;
                DOM.btnMacos.className = inactive;
                DOM.headerWindows.classList.remove('hidden');
                DOM.headerMacos.classList.add('hidden');
            }
        }

        // Handle Image Fit Logic
        function setFit(mode) {
            const active = "flex-1 py-1.5 text-xs font-bold rounded-md shadow-sm bg-white text-gray-900 transition-all";
            const inactive = "flex-1 py-1.5 text-xs font-bold rounded-md text-gray-500 hover:text-gray-900 transition-all";
            
            // Reset UI
            DOM.btnFitAuto.className = inactive;
            DOM.btnFitFill.className = inactive;
            DOM.btnFitContain.className = inactive;

            // Reset Classes
            DOM.imageWrapper.classList.remove('aspect-video');
            DOM.mockupImage.classList.remove('h-auto', 'h-full', 'object-cover', 'object-contain');

            if (mode === 'auto') {
                DOM.btnFitAuto.className = active;
                DOM.mockupImage.classList.add('h-auto');
            } else if (mode === 'fill') {
                DOM.btnFitFill.className = active;
                DOM.imageWrapper.classList.add('aspect-video');
                DOM.mockupImage.classList.add('h-full', 'object-cover');
            } else if (mode === 'contain') {
                DOM.btnFitContain.className = active;
                DOM.imageWrapper.classList.add('aspect-video');
                DOM.mockupImage.classList.add('h-full', 'object-contain');
            }
        }

        // Handle Quality Toggle
        function setQuality(quality) {
            const active = "flex-1 py-2 text-xs font-bold rounded-lg border-2 border-gray-900 bg-gray-900 text-white shadow-md transition-all";
            const inactive = "flex-1 py-2 text-xs font-bold rounded-lg border border-gray-200 bg-white text-gray-500 hover:bg-gray-50 transition-all";
            
            DOM.btnQLow.className = inactive;
            DOM.btnQHigh.className = inactive;
            DOM.btnQ4k.className = inactive;

            if (quality === 'low') {
                DOM.btnQLow.className = active;
                exportQualityScale = 1;
            } else if (quality === 'high') {
                DOM.btnQHigh.className = active;
                exportQualityScale = 2;
            } else if (quality === '4k') {
                DOM.btnQ4k.className = active;
                exportQualityScale = 4;
            }
        }

        // Handle File Upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    DOM.mockupImage.src = e.target.result;
                    DOM.mockupImage.onload = () => {
                        DOM.placeholder.classList.add('hidden');
                        DOM.placeholder.classList.remove('relative');
                        DOM.mockupImage.classList.remove('hidden');
                        hasImage = true;
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        // Export Function
        function exportMockup() {
            if (!hasImage) {
                alert("Please upload a screenshot first.");
                return;
            }

            DOM.loadingState.classList.remove('hidden');
            DOM.urlInputs.forEach(input => input.setAttribute('readonly', 'true'));

            // Timeout allows the DOM to render the loading screen before processing
            setTimeout(() => {
                htmlToImage.toPng(DOM.exportNode, { 
                    quality: 1.0,
                    pixelRatio: exportQualityScale
                })
                .then(function (dataUrl) {
                    const link = document.createElement('a');
                    link.download = `mockup-pro-${Date.now()}.png`;
                    link.href = dataUrl;
                    link.click();
                })
                .catch(function (error) {
                    console.error('Export error:', error);
                    alert("Failed to export image.");
                })
                .finally(function () {
                    DOM.loadingState.classList.add('hidden');
                    DOM.urlInputs.forEach(input => input.removeAttribute('readonly'));
                });
            }, 100); 
        }
    </script>
</body>
</html>
