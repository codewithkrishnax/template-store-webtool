<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canvas Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

    <style>
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #f3f4f6;
        }
        .app-container {
            height: 100dvh; 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* The Canvas Wrapper */
        .canvas-bg {
            background-color: #e5e7eb;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 16:9 Aspect Ratio enforcement for the export node */
        .slide-canvas {
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            /* Default text styles for export */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Universal Draggable Class */
        .draggable-item {
            position: absolute;
            cursor: grab;
            transform: translate(-50%, -50%);
            user-select: none;
            -webkit-user-drag: none;
            padding: 4px;
            border: 2px solid transparent;
            border-radius: 6px;
            transition: border 0.1s;
        }
        
        .draggable-item:active {
            cursor: grabbing;
        }

        /* Active selection styling */
        .is-selected {
            border-color: #3b82f6 !important;
            z-index: 50 !important;
        }
        
        /* Make sure text elements don't block clicks when empty */
        .text-element {
            min-width: 100px;
            min-height: 30px;
            text-align: center;
        }
        
        /* Hide color input default styles */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body class="font-sans antialiased overflow-hidden flex justify-center text-gray-900">

    <div class="app-container flex flex-col w-full max-w-md bg-white border-x border-gray-200 shadow-2xl relative">
        
        <header class="flex items-center justify-between px-5 py-3.5 border-b border-gray-100 shrink-0 bg-white z-10 shadow-sm">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-bounding-box text-2xl text-gray-900"></i>
                <div>
                    <h1 class="text-base font-bold tracking-tight text-gray-900 leading-none">Canvas Studio</h1>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mt-0.5">Image Exporter</p>
                </div>
            </div>
            <button onclick="exportCanvas()" id="exportBtn" class="flex items-center gap-1.5 px-3 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-lg text-xs font-bold transition-colors shadow-md">
                <i class="ph ph-download-simple text-base"></i>
                Save Image
            </button>
        </header>

        <main class="flex-1 flex flex-col overflow-y-auto hide-scrollbar canvas-bg relative" id="mainArea">
            
            <div id="loadingState" class="hidden absolute inset-0 bg-white/70 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
                <i class="ph ph-spinner-gap text-4xl text-gray-900 animate-spin mb-3"></i>
                <p class="text-sm font-bold text-gray-900 tracking-wide">Rendering Image...</p>
            </div>

            <div class="p-5 pb-2 shrink-0 relative w-full flex justify-center">
                
                <div id="export-node" class="slide-canvas w-full rounded-xl shadow-lg border border-gray-300" onclick="deselectAll(event)">
                    
                    <h2 id="drag-title" class="draggable-item text-element font-bold text-gray-900 text-xl md:text-2xl w-[90%] leading-tight" style="left: 50%; top: 25%;">
                        Tap to move title
                    </h2>
                    
                    <div id="drag-content" class="draggable-item text-element text-gray-600 text-xs md:text-sm w-[90%]" style="left: 50%; top: 60%;">
                        Tap to move this paragraph. Add your descriptive text here.
                    </div>
                    
                    <div id="imageLayer" class="pointer-events-none absolute inset-0"></div>
                </div>
                
            </div>

            <p class="text-[10px] text-gray-400 text-center font-semibold uppercase tracking-widest mt-2 mb-4 shrink-0">
                Drag elements to position them
            </p>

            <div class="px-5 pb-6 flex flex-col gap-4 flex-1 bg-white rounded-t-3xl shadow-[0_-10px_20px_rgba(0,0,0,0.03)] pt-6 border-t border-gray-100">
                
                <div id="imageControls" class="hidden bg-gray-50 border border-gray-200 rounded-xl p-4 mb-2">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-[11px] font-bold text-gray-900 uppercase tracking-wider">Image Options</label>
                        <button onclick="deleteSelectedImage()" class="text-red-500 hover:text-red-600 text-[11px] font-bold uppercase flex items-center gap-1">
                            <i class="ph ph-trash text-sm"></i> Delete
                        </button>
                    </div>
                    <div class="flex items-center gap-3">
                        <i class="ph ph-image text-gray-400"></i>
                        <input type="range" id="imageSizeSlider" min="10" max="150" value="50" oninput="resizeSelectedImage(this.value)" class="flex-1 h-1.5 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-gray-900">
                        <i class="ph ph-arrows-out text-gray-400"></i>
                    </div>
                </div>

                <div id="globalControls" class="flex flex-col gap-4">
                    
                    <div class="flex gap-3">
                        <div class="flex-1 bg-gray-50 border border-gray-200 rounded-xl p-3 flex flex-col justify-center relative overflow-hidden">
                            <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1 z-10 pointer-events-none">Background</label>
                            <div class="flex items-center gap-2 z-10 pointer-events-none">
                                <i class="ph-fill ph-palette text-gray-900 text-lg"></i>
                                <span class="text-xs font-semibold text-gray-900" id="colorHexText">#FFFFFF</span>
                            </div>
                            <input type="color" id="bgColorPicker" value="#ffffff" oninput="changeBgColor(this.value)" class="absolute inset-[-20px] w-[200%] h-[200%] cursor-pointer opacity-0 z-20">
                        </div>

                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                        <button onclick="document.getElementById('imageInput').click()" class="flex-1 flex flex-col items-center justify-center gap-1 py-3 bg-gray-900 hover:bg-gray-800 active:bg-gray-700 rounded-xl transition-colors shadow-md text-white">
                            <i class="ph ph-image-square text-xl"></i>
                            <span class="text-[10px] font-bold uppercase tracking-wider">Add Image</span>
                        </button>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Edit Title</label>
                        <input type="text" id="inputTitle" oninput="updateText('title', this.value)" value="Tap to move title" 
                               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-semibold text-gray-900 outline-none focus:border-gray-900 focus:bg-white transition-all">
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Edit Paragraph</label>
                        <textarea id="inputContent" oninput="updateText('content', this.value)" rows="3"
                                  class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 outline-none focus:border-gray-900 focus:bg-white transition-all resize-none">Tap to move this paragraph. Add your descriptive text here.</textarea>
                    </div>
                </div>

            </div>
        </main>
        
        <div class="pb-safe bg-white shrink-0 border-t border-gray-100"></div>
    </div>

    <script>
        // DOM Elements
        const DOM = {
            exportNode: document.getElementById('export-node'),
            dragTitle: document.getElementById('drag-title'),
            dragContent: document.getElementById('drag-content'),
            imageLayer: document.getElementById('imageLayer'),
            colorHexText: document.getElementById('colorHexText'),
            globalControls: document.getElementById('globalControls'),
            imageControls: document.getElementById('imageControls'),
            imageSizeSlider: document.getElementById('imageSizeSlider'),
            exportBtn: document.getElementById('exportBtn'),
            loadingState: document.getElementById('loadingState')
        };

        // State
        let selectedImage = null; // Holds reference to the actively selected image DOM node

        // Initialize Native Draggables
        makeDraggable(DOM.dragTitle);
        makeDraggable(DOM.dragContent);

        // Text Updates
        function updateText(type, value) {
            if (type === 'title') {
                DOM.dragTitle.innerHTML = value || '&nbsp;'; // Prevent collapsing
            } else {
                DOM.dragContent.innerHTML = value 
                    ? value.replace(/\n/g, '<br>') 
                    : '&nbsp;';
            }
        }

        // Background Color Update
        function changeBgColor(hex) {
            DOM.exportNode.style.backgroundColor = hex;
            DOM.colorHexText.textContent = hex.toUpperCase();
        }

        // --- Image Handling & Drag/Select Logic ---
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const imgEl = document.createElement('img');
                    imgEl.src = e.target.result;
                    imgEl.className = 'draggable-item pointer-events-auto object-contain';
                    
                    // Initial setup: Centered, 50% width
                    imgEl.style.left = `50%`;
                    imgEl.style.top = `50%`;
                    imgEl.style.width = `50%`; 
                    imgEl.dataset.wPercent = '50';

                    makeDraggable(imgEl);
                    
                    // Selection handling
                    imgEl.addEventListener('mousedown', (e) => selectImage(e, imgEl));
                    imgEl.addEventListener('touchstart', (e) => selectImage(e, imgEl), {passive: false});

                    DOM.imageLayer.appendChild(imgEl);
                    
                    // Auto-select the newly added image
                    selectImage(null, imgEl);
                };
                reader.readAsDataURL(file);
            }
            event.target.value = ''; // Reset input
        }

        // --- Selection Engine ---
        function selectImage(event, imgEl) {
            if (event) event.stopPropagation(); // Stop click from hitting the background deselect
            
            // Clear previous selection
            document.querySelectorAll('.is-selected').forEach(el => el.classList.remove('is-selected'));
            
            selectedImage = imgEl;
            selectedImage.classList.add('is-selected');

            // Update Slider to match image's current width
            DOM.imageSizeSlider.value = selectedImage.dataset.wPercent || 50;

            // Swap UI Panels
            DOM.globalControls.classList.add('hidden');
            DOM.imageControls.classList.remove('hidden');
        }

        function deselectAll(event) {
            // Only deselect if they clicked directly on the canvas background, not on a draggable item
            if (event.target === DOM.exportNode || event.target === DOM.imageLayer) {
                document.querySelectorAll('.is-selected').forEach(el => el.classList.remove('is-selected'));
                selectedImage = null;
                
                // Swap UI Panels back
                DOM.imageControls.classList.add('hidden');
                DOM.globalControls.classList.remove('hidden');
            }
        }

        // Image Resize Engine (Driven by Slider)
        function resizeSelectedImage(val) {
            if (selectedImage) {
                selectedImage.style.width = `${val}%`;
                selectedImage.dataset.wPercent = val; // Store state
            }
        }

        // Image Delete Engine
        function deleteSelectedImage() {
            if (selectedImage) {
                selectedImage.remove();
                deselectAll({ target: DOM.exportNode }); // Force deselect UI reset
            }
        }

        // --- Core Drag Engine (Mouse + Touch) ---
        function makeDraggable(element) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            const dragStart = (e) => {
                if (e.type === 'touchstart') e.preventDefault(); // Prevent scrolling while moving elements
                
                // Bring to front temporarily
                element.style.zIndex = "100";

                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX;
                startY = clientY;
                
                initialLeft = parseFloat(element.style.left) || 50;
                initialTop = parseFloat(element.style.top) || 50;
            };

            const drag = (e) => {
                if (!isDragging) return;
                e.preventDefault(); // crucial for mobile

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - startX;
                const dy = clientY - startY;

                const rect = DOM.exportNode.getBoundingClientRect();
                
                // Translate pixel movement to percentage movement
                let newLeft = initialLeft + (dx / rect.width) * 100;
                let newTop = initialTop + (dy / rect.height) * 100;

                element.style.left = `${newLeft}%`;
                element.style.top = `${newTop}%`;
            };

            const dragEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                element.style.zIndex = ""; // Restore z-index
            };

            // Event Binding
            element.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);
            
            element.addEventListener('touchstart', dragStart, { passive: false });
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('touchend', dragEnd);
        }

        // --- Canvas to Image Exporter ---
        function exportCanvas() {
            // 1. Hide UI borders/selections before export
            document.querySelectorAll('.is-selected').forEach(el => el.classList.remove('is-selected'));
            
            DOM.loadingState.classList.remove('hidden');
            const originalBtnText = DOM.exportBtn.innerHTML;
            DOM.exportBtn.innerHTML = '<i class="ph ph-spinner-gap animate-spin text-base"></i> Saving...';
            DOM.exportBtn.disabled = true;

            // 2. Wait 100ms for DOM to apply selection removals & loader
            setTimeout(() => {
                htmlToImage.toPng(DOM.exportNode, { 
                    quality: 1.0,
                    pixelRatio: 3 // High resolution export (3x)
                })
                .then(function (dataUrl) {
                    const link = document.createElement('a');
                    link.download = `canvas-export-${Date.now()}.png`;
                    link.href = dataUrl;
                    link.click();
                })
                .catch(function (error) {
                    console.error('Export error:', error);
                    alert("Failed to export image.");
                })
                .finally(function () {
                    // Restore UI
                    if(selectedImage) selectedImage.classList.add('is-selected');
                    DOM.loadingState.classList.add('hidden');
                    DOM.exportBtn.innerHTML = originalBtnText;
                    DOM.exportBtn.disabled = false;
                });
            }, 100);
        }
    </script>
</body>
</html>
