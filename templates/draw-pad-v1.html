<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111113">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>4K Drawing Pad</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111113;--surface:#1c1c1f;--surface2:#27272b;--surface3:#313136;
  --border:rgba(255,255,255,0.08);--text:#f0f0f2;--text2:#8e8e99;
  --accent:#4f8ef7;--danger:#f0544f;--success:#34c479;--warn:#f5a623;
  --top-h:56px;--tool-h:52px;--size-h:42px;--tab-h:62px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;user-select:none;}
  
#app{display:flex;flex-direction:column;height:100dvh;width:100%;margin:0 auto;position:relative;overflow:hidden;}
.main-col{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;width:100%;}

.topbar{height:var(--top-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;z-index:10;}
.topbar-title{font-size:17px;font-weight:600;flex:1;letter-spacing:-.3px;}
.topbar-title span{color:var(--accent); font-weight:700;}
.icon-btn{width:36px;height:36px;border-radius:10px;border:none;background:var(--surface2);
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,transform .1s;flex-shrink:0;}
.icon-btn:active{transform:scale(.9);background:var(--surface3);}
.icon-btn svg{width:17px;height:17px;}

.canvas-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0;}
#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:#0a0a0c;position:relative;min-height:0; padding:10px;}
  
/* The canvas background is handled via CSS for seamless theme toggling */
#main-canvas{
  background-color: #ffffff; 
  border-radius:8px; 
  box-shadow:0 4px 20px rgba(0,0,0,0.4); 
  touch-action:none; 
  cursor:crosshair; 
  max-width:100%; 
  max-height:100%;
  transition: background-color 0.3s ease;
}

.tools-panel{height:var(--tool-h);background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 6px;gap:1px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.tools-panel::-webkit-scrollbar{display:none;}
.tool-btn{width:34px;height:34px;border-radius:9px;border:none;background:transparent;
  color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s,color .15s;flex-shrink:0;}
.tool-btn svg{width:17px;height:17px;}
.tool-btn.active{background:var(--accent);color:#fff;}
.tool-btn:not(.active):hover{background:var(--surface2);color:var(--text);}
.tool-btn:not(.active):active{background:var(--surface3);}
.tdiv{width:1px;height:20px;background:var(--border);margin:0 6px;flex-shrink:0;}

.color-row{display:flex;gap:6px;align-items:center;flex-shrink:0;padding:0 4px;}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform .15s,border-color .15s;flex-shrink:0;box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);}
.color-dot.active{border-color:#fff;transform:scale(1.25);}

/* Custom Color Picker Styles */
.custom-color-wrap {
  position: relative;
  overflow: hidden;
  background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
}
.custom-color-wrap input[type="color"] {
  position: absolute;
  opacity: 0;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  cursor: pointer;
}

.size-row{height:var(--size-h);background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;}
.size-row label{color:var(--text2);font-size:11px;min-width:30px;}
.size-row input[type=range]{flex:1;-webkit-appearance:none;height:3px;background:var(--surface3);border-radius:3px;outline:none;}
.size-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;transition:transform .1s;}
.size-row input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2);}
#size-val{font-size:11px;color:var(--text2);min-width:18px;text-align:right;}

.bottom-nav{height:var(--tab-h);background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);z-index:20;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:100%;border:none;background:transparent;color:var(--text2);cursor:pointer;
  transition:color .15s;font-family:inherit;font-size:10px;font-weight:500;letter-spacing:.3px;}
.nav-btn svg{width:21px;height:21px;}
.nav-btn.danger{color:var(--danger);}
.nav-btn:hover{color:var(--text);}
.nav-btn.danger:hover{color:#ff7a75;}
.nav-btn:active{opacity:.7;}

#toast{position:absolute;bottom:calc(var(--tab-h)+14px);left:50%;
  transform:translateX(-50%) translateY(16px);background:var(--surface3);color:var(--text);
  padding:8px 18px;border-radius:22px;font-size:13px;font-weight:500;pointer-events:none;
  opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:99;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* DESKTOP RESPONSIVE DESIGN */
@media (min-width: 768px) {
  #app { flex-direction: row; }
  .bottom-nav {
    flex-direction: column; width: 86px; height: 100%; border-top: none;
    border-right: 1px solid var(--border); order: -1; padding: 24px 0;
    justify-content: flex-start; gap: 32px;
  }
  .nav-btn { height: auto; flex: none; gap: 6px; }
  #toast { bottom: 32px; }
}
</style>
</head>
<body>
<div id="app">

  <div class="main-col">
    <div class="topbar">
      <div class="topbar-title">4K Draw<span>·</span>Pad</div>
      <button class="icon-btn" id="undo-btn" title="Undo">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a5 5 0 010 10H9M3 10l4-4M3 10l4 4"/></svg>
      </button>
      <button class="icon-btn" id="redo-btn" title="Redo">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 10H11a5 5 0 000 10h4M21 10l-4-4M21 10l-4 4"/></svg>
      </button>
    </div>

    <div class="canvas-area">
      <div id="canvas-wrap">
        <canvas id="main-canvas"></canvas>
      </div>

      <div class="tools-panel">
        <button class="tool-btn active" data-tool="pen" title="Pen">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 13l6.5-6.5a2 2 0 012.828 2.828L11.828 15.828a2 2 0 01-1.414.586H8v-2.414A2 2 0 018.586 12z"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="Line">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="19" x2="19" y2="5" stroke-linecap="round"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Circle">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 20H7L3 16l11-11 6 6-3.5 3.5M6 20l-3-3"/></svg>
        </button>
        
        <div class="tdiv"></div>
        
        <div class="color-row">
          <div class="color-dot active" style="background:#000000; border-color:#fff;" data-color="#000000"></div>
          <div class="color-dot" style="background:#8e8e99" data-color="#8e8e99"></div>
          <div class="color-dot" style="background:#f0544f" data-color="#f0544f"></div>
          <div class="color-dot" style="background:#f5a623" data-color="#f5a623"></div>
          <div class="color-dot" style="background:#34c479" data-color="#34c479"></div>
          <div class="color-dot" style="background:#4f8ef7" data-color="#4f8ef7"></div>
          <div class="color-dot" style="background:#ffffff" data-color="#ffffff"></div>
          
          <!-- CUSTOM COLOR PICKER -->
          <div class="color-dot custom-color-wrap" title="Custom Color">
            <input type="color" id="custom-color-input" value="#ff00ff">
          </div>
        </div>
      </div>

      <div class="size-row">
        <label>Size</label>
        <input type="range" id="size-slider" min="1" max="50" value="4">
        <span id="size-val">4</span>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn danger" id="btn-clear">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M4 7h16M10 3h4"/></svg>
      Clear
    </button>
    <button class="nav-btn" id="btn-bg">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      Theme
    </button>
    <button class="nav-btn" id="btn-save">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 12l5 5 5-5M12 4v13"/></svg>
      Save 4K
    </button>
  </div>

  <div id="toast"></div>

</div>

<script>
// ─── DOM REFS ────────────────────────────────────────────────────────────────
const canvas   = document.getElementById('main-canvas');
const ctx      = canvas.getContext('2d', { willReadFrequently: true });
const wrap     = document.getElementById('canvas-wrap');
const sizeSl   = document.getElementById('size-slider');
const sizeVal  = document.getElementById('size-val');

// ─── STATE ───────────────────────────────────────────────────────────────────
let tool      = 'pen';
let penColor  = '#000000';
let brushSize = 4;
let isDarkTheme = false;

// 4K MULTIPLIER (Device Pixel Ratio)
// A multiplier of 4 pushes the internal drawing to roughly 4K quality standard.
const dpr = 4; 

let isDrawing = false;
let startX = 0, startY = 0;
let snapshotData = null;

let undoStack = [];
let redoStack = [];

// ─── INIT CANVAS ─────────────────────────────────────────────────────────────
function initCanvas() {
  const rect = wrap.getBoundingClientRect();
  const w = Math.max(rect.width - 20, 300);
  const h = Math.max(rect.height - 20, 300);
  
  // Set Physical Canvas resolution extremely high (4K logic)
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  
  // Keep the CSS visual size matching the screen
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  
  // Do NOT fill background. Keep it fully transparent. 
  // Background color is handled entirely by CSS for non-destructive drawing.
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  saveState(); 
}

// ─── THEME TOGGLE ────────────────────────────────────────────────────────────
document.getElementById('btn-bg').addEventListener('click', () => {
  isDarkTheme = !isDarkTheme;
  // Change ONLY the CSS. The pixel buffer remains transparent!
  canvas.style.backgroundColor = isDarkTheme ? '#1c1c1f' : '#ffffff';
  toast(isDarkTheme ? 'Dark Theme' : 'Light Theme');
});

// ─── POINTER EVENTS ──────────────────────────────────────────────────────────
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const s = e.changedTouches ? e.changedTouches[0] : e;
  // Multiply coordinates by DPR so they match the high-res internal canvas
  return { 
    x: (s.clientX - r.left) * dpr, 
    y: (s.clientY - r.top) * dpr 
  };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  isDrawing = true;
  
  const { x, y } = getPos(e);
  startX = x; 
  startY = y;

  ctx.beginPath();
  ctx.moveTo(x, y);
  
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  // Scale brush size up by DPR
  const actualSize = brushSize * dpr;
  
  if (tool === 'eraser') {
    // DESTINATION-OUT acts as a true transparent eraser
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = actualSize * 2.5; 
    ctx.strokeStyle = "rgba(0,0,0,1)"; 
  } else {
    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = actualSize;
    ctx.strokeStyle = penColor;
    ctx.fillStyle = penColor;
  }

  // Save high-res snapshot for shape previews
  if (tool !== 'pen' && tool !== 'eraser') {
    snapshotData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
});

canvas.addEventListener('pointermove', e => {
  if (!isDrawing) return;
  e.preventDefault();
  const { x, y } = getPos(e);

  if (tool === 'pen' || tool === 'eraser') {
    ctx.lineTo(x, y);
    ctx.stroke();
  } else if (snapshotData) {
    ctx.putImageData(snapshotData, 0, 0);
    ctx.beginPath();
    
    switch (tool) {
      case 'line':
        ctx.moveTo(startX, startY); ctx.lineTo(x, y); ctx.stroke();
        break;
      case 'rect':
        ctx.strokeRect(startX, startY, x - startX, y - startY);
        break;
      case 'circle':
        const r = Math.hypot(x - startX, y - startY);
        ctx.arc(startX, startY, r, 0, Math.PI * 2); ctx.stroke();
        break;
    }
  }
});

canvas.addEventListener('pointerup', e => {
  if (!isDrawing) return;
  isDrawing = false;
  
  const { x, y } = getPos(e);
  if ((tool === 'pen' || tool === 'eraser') && x === startX && y === startY) {
    ctx.lineTo(x + 0.1, y + 0.1); 
    ctx.stroke();
  }

  snapshotData = null;
  saveState();
});

// ─── HISTORY (UNDO/REDO) ─────────────────────────────────────────────────────
function saveState() {
  const dataURL = canvas.toDataURL('image/png'); // Keeps alpha channel safe
  if (undoStack[undoStack.length - 1] !== dataURL) {
    undoStack.push(dataURL);
    redoStack = [];
    if (undoStack.length > 30) undoStack.shift(); 
  }
}

function loadState(dataURL) {
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Draw back the pure pixels
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(img, 0, 0);
  };
  img.src = dataURL;
}

document.getElementById('undo-btn').addEventListener('click', () => {
  if (undoStack.length > 1) {
    redoStack.push(undoStack.pop());
    loadState(undoStack[undoStack.length - 1]);
    toast('Undo');
  } else toast('Nothing to undo');
});

document.getElementById('redo-btn').addEventListener('click', () => {
  if (redoStack.length > 0) {
    const dataURL = redoStack.pop();
    undoStack.push(dataURL);
    loadState(dataURL);
    toast('Redo');
  } else toast('Nothing to redo');
});

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  saveState();
  toast('Canvas Cleared');
});

document.getElementById('btn-save').addEventListener('click', () => {
  // Create a temporary canvas to composite the CSS background color + drawing
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = canvas.width;
  tmpCanvas.height = canvas.height;
  const tCtx = tmpCanvas.getContext('2d');
  
  // Fill background
  tCtx.fillStyle = isDarkTheme ? '#1c1c1f' : '#ffffff';
  tCtx.fillRect(0, 0, tmpCanvas.width, tmpCanvas.height);
  
  // Draw transparent 4K drawing over the background
  tCtx.drawImage(canvas, 0, 0);

  // Trigger highest quality export
  const link = document.createElement('a');
  link.download = `Drawing_4K_${Date.now()}.png`;
  link.href = tmpCanvas.toDataURL('image/png', 1.0);
  link.click();
  toast('4K Image Saved ✓');
});

// ─── TOOLS & COLOR UI ────────────────────────────────────────────────────────
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;
    canvas.style.cursor = tool === 'eraser' ? 'cell' : tool === 'pen' ? 'crosshair' : 'default';
  });
});

const customInput = document.getElementById('custom-color-input');
const customWrap = document.querySelector('.custom-color-wrap');

function setActiveColor(colorHex, element) {
  document.querySelectorAll('.color-dot').forEach(d => {
    d.classList.remove('active');
    d.style.transform = 'scale(1)';
  });
  element.classList.add('active');
  element.style.transform = 'scale(1.25)';
  penColor = colorHex;
  
  if (tool === 'eraser') document.querySelector('[data-tool="pen"]').click();
}

// Pre-defined color dots
document.querySelectorAll('.color-dot:not(.custom-color-wrap)').forEach(dot => {
  dot.addEventListener('click', () => setActiveColor(dot.dataset.color, dot));
});

// Custom Color Wrap click (restore custom color if user clicks it again later)
customWrap.addEventListener('click', () => {
  setActiveColor(customInput.value, customWrap);
});

// Changing the Custom Color Native Input
customInput.addEventListener('input', (e) => {
  const newColor = e.target.value;
  customWrap.style.background = newColor;
  setActiveColor(newColor, customWrap);
});

sizeSl.addEventListener('input', () => {
  brushSize = parseInt(sizeSl.value);
  sizeVal.textContent = brushSize;
});

// ─── TOAST NOTIFICATION ──────────────────────────────────────────────────────
let toastTmr;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => el.classList.remove('show'), 2000);
}

// ─── STARTUP ─────────────────────────────────────────────────────────────────
setTimeout(initCanvas, 100);
</script>
</body>
</html>
