<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>Palette Extractor</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

    <style>
        /* Native App Minimalist Base */
        :root {
            --bg-base: #F2F2F7; /* iOS System Gray */
            --bg-surface: #FFFFFF;
            --text-main: #000000;
            --text-muted: #8E8E93;
            --border-light: #E5E5EA;
            --accent: #000000; /* Minimalist Black */
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* App Header */
        header {
            background-color: var(--bg-surface);
            padding: 16px;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.4px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            z-index: 10;
        }

        /* Main Image Area */
        .image-region {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 0; /* Important for flex child to shrink properly */
            position: relative;
        }

        .image-container {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-lg);
            background-color: var(--bg-surface);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            border: 2px dashed var(--border-light);
        }

        /* Upload Placeholder State */
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .placeholder svg {
            width: 48px;
            height: 48px;
            stroke: var(--text-muted);
        }

        .placeholder span {
            font-size: 15px;
            font-weight: 500;
        }

        /* Uploaded Image State */
        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            padding: 8px;
        }

        /* Hidden File Input */
        input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }

        /* Bottom Controls & Palette Area */
        .bottom-sheet {
            background-color: var(--bg-surface);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
            z-index: 10;
        }

        .sheet-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Palette Swatches */
        .palette-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none; /* Firefox */
            -webkit-overflow-scrolling: touch;
        }
        
        .palette-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .swatch-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s;
        }

        .swatch-card:active {
            transform: scale(0.92);
        }

        .color-block {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.05);
            background-color: #E5E5EA; /* Default gray */
        }

        .color-hex {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* Primary Upload Button */
        .btn-primary {
            background-color: var(--accent);
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        /* Custom Toast Notification */
        .toast {
            position: fixed;
            top: -100px; /* Hidden off top */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            top: 60px;
        }

        /* Empty State specific styles */
        .empty-state .sheet-title {
            display: none;
        }
    </style>
</head>
<body>

    <header>Palette Extractor</header>

    <div class="image-region">
        <div class="image-container" id="drop-zone">
            <input type="file" id="image-input" accept="image/*">
            
            <div class="placeholder" id="placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>
                <span>Tap to Select Image</span>
            </div>
            
            <img id="preview-image" class="preview-img" alt="Preview">
        </div>
    </div>

    <div class="bottom-sheet empty-state" id="bottom-sheet">
        <div class="sheet-title">Extracted Colors (Tap to Copy)</div>
        
        <div class="palette-container" id="palette-container">
            </div>

        <div class="btn-primary" style="overflow: hidden;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            Choose New Image
            <input type="file" id="btn-input" accept="image/*">
        </div>
    </div>

    <div class="toast" id="toast">Color Copied!</div>

    <script>
        const imageInput = document.getElementById('image-input');
        const btnInput = document.getElementById('btn-input');
        const previewImage = document.getElementById('preview-image');
        const placeholder = document.getElementById('placeholder');
        const paletteContainer = document.getElementById('palette-container');
        const bottomSheet = document.getElementById('bottom-sheet');
        const dropZone = document.getElementById('drop-zone');
        const toast = document.getElementById('toast');

        // Initialize ColorThief
        const colorThief = new ColorThief();

        // Bind both file inputs to the same handler
        imageInput.addEventListener('change', handleImageUpload);
        btnInput.addEventListener('change', handleImageUpload);

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(event) {
                // Update UI state
                placeholder.style.display = 'none';
                previewImage.style.display = 'block';
                dropZone.style.border = 'none';
                
                // Set image source
                previewImage.src = event.target.result;
            };
            
            reader.readAsDataURL(file);
        }

        // Wait for image to fully load before extracting colors
        previewImage.addEventListener('load', function() {
            extractColors(previewImage);
        });

        function extractColors(imgElement) {
            try {
                // Get 6 dominant colors
                const palette = colorThief.getPalette(imgElement, 6);
                
                // Clear existing swatches
                paletteContainer.innerHTML = '';
                
                // Generate UI
                palette.forEach(rgbObj => {
                    const hexCode = rgbToHex(rgbObj[0], rgbObj[1], rgbObj[2]);
                    createColorSwatch(hexCode);
                });

                // Remove empty state styling to show the "Extracted Colors" title
                bottomSheet.classList.remove('empty-state');

            } catch (error) {
                console.error("Error extracting colors:", error);
            }
        }

        // Helper: Convert RGB array to HEX string
        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
        }

        // Build the HTML for a color swatch
        function createColorSwatch(hexCode) {
            const card = document.createElement('div');
            card.className = 'swatch-card';
            
            const block = document.createElement('div');
            block.className = 'color-block';
            block.style.backgroundColor = hexCode;
            
            const label = document.createElement('div');
            label.className = 'color-hex';
            label.innerText = hexCode;

            card.appendChild(block);
            card.appendChild(label);
            
            // Add copy functionality
            card.addEventListener('click', () => {
                copyToClipboard(hexCode);
            });

            paletteContainer.appendChild(card);
        }

        // Clipboard & Toast Logic
        let toastTimeout;
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied ${text}`);
            }).catch(() => {
                // Fallback for older browsers
                showToast("Failed to copy");
            });
        }

        function showToast(message) {
            toast.innerText = message;
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
