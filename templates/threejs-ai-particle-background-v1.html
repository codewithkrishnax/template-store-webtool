<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative AI Background - Three.js</title>
    <style>
      body {
        margin: 0;
        overflow: hidden; /* Prevent scrollbars */
        background-color: #000000; /* Fallback background */
        font-family: "Inter", sans-serif; /* Using Inter font */
      }
      #threejs-canvas {
        display: block; /* Remove any default spacing */
        width: 100vw;
        height: 100vh;
      }
      /* Optional: Add a subtle gradient overlay on top of the canvas if desired */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Allow interaction with canvas if needed */
        /* Example gradient:
            background: linear-gradient(45deg, rgba(10, 0, 30, 0.3), rgba(0, 20, 40, 0.2));
            */
        z-index: 1; /* Ensure it's above the canvas but below other content */
      }
    </style>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="threejs-canvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
      // --- Global Variables ---
      let scene, camera, renderer;
      let particles, particleSystem;
      const particleCount = 10000; // Number of particles
      const particleSpeed = 0.0005; // Base speed of particles

      // --- Initialization ---
      function init() {
        // Scene
        scene = new THREE.Scene();

        // Camera
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.z = 30; // Adjusted for better initial view of particles

        // Renderer
        const canvas = document.getElementById("threejs-canvas");
        renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          alpha: true,
        }); // alpha: true for transparent background if needed
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // For sharper rendering on high DPI screens

        // --- Particle System ---
        const particleGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3); // x, y, z for each particle
        const colors = new Float32Array(particleCount * 3); // r, g, b for each particle
        const velocities = new Float32Array(particleCount * 3); // vx, vy, vz for each particle

        const color1 = new THREE.Color(0x00ffff); // Cyan
        const color2 = new THREE.Color(0xaa00ff); // Purple
        const color3 = new THREE.Color(0x0077ff); // Bright Blue

        for (let i = 0; i < particleCount; i++) {
          // Position (spread out in a larger volume)
          positions[i * 3] = (Math.random() - 0.5) * 100;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
          positions[i * 3 + 2] = (Math.random() - 0.5) * 100;

          // Color (interpolate between a few AI-themed colors)
          let randomColor;
          const r = Math.random();
          if (r < 0.33) randomColor = color1;
          else if (r < 0.66) randomColor = color2;
          else randomColor = color3;

          colors[i * 3] = randomColor.r;
          colors[i * 3 + 1] = randomColor.g;
          colors[i * 3 + 2] = randomColor.b;

          // Initial Velocities (random direction)
          velocities[i * 3] = (Math.random() - 0.5) * 0.1;
          velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.1;
          velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
        }

        particleGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        particleGeometry.setAttribute(
          "color",
          new THREE.BufferAttribute(colors, 3),
        );
        particleGeometry.setAttribute(
          "velocity",
          new THREE.BufferAttribute(velocities, 3),
        ); // Store velocities

        const sprite = new THREE.TextureLoader().load(
          "https://threejs.org/examples/textures/sprites/circle.png",
        );

        const particleMaterial = new THREE.PointsMaterial({
          size: 0.4,
          map: sprite, // Add the circular sprite
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          transparent: true,
          opacity: 0.9,
          depthWrite: false,
        });

        particleSystem = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particleSystem);

        // --- Event Listeners ---
        window.addEventListener("resize", onWindowResize, false);
        document.addEventListener("mousemove", onMouseMove, false); // For mouse interaction

        // Start animation loop
        animate();
      }

      // --- Mouse Interaction ---
      let mouseX = 0,
        mouseY = 0;
      const windowHalfX = window.innerWidth / 2;
      const windowHalfY = window.innerHeight / 2;

      function onMouseMove(event) {
        mouseX = (event.clientX - windowHalfX) / 5; // Divide to reduce sensitivity
        mouseY = (event.clientY - windowHalfY) / 5;
      }

      // --- Animation Loop ---
      function animate() {
        requestAnimationFrame(animate);

        const time = Date.now() * 0.0001; // Time factor for animation

        // Update particles
        const positions = particleSystem.geometry.attributes.position.array;
        const velocities = particleSystem.geometry.attributes.velocity.array;

        for (let i = 0; i < particleCount; i++) {
          // Basic movement based on initial velocity
          positions[i * 3] += velocities[i * 3] * particleSpeed * 100; // Multiply speed for visibility
          positions[i * 3 + 1] += velocities[i * 3 + 1] * particleSpeed * 100;
          positions[i * 3 + 2] += velocities[i * 3 + 2] * particleSpeed * 100;

          // Add some sinusoidal movement for a more organic feel
          positions[i * 3 + 1] +=
            Math.sin(time + positions[i * 3] * 0.1) * 0.02;
          positions[i * 3] +=
            Math.cos(time + positions[i * 3 + 1] * 0.1) * 0.02;

          // Boundary check and reset (wrap around)
          // Particles that go too far are reset to the other side with a new random depth
          const boundary = 60; // Boundary size
          if (positions[i * 3] > boundary || positions[i * 3] < -boundary) {
            positions[i * 3] = -Math.sign(positions[i * 3]) * boundary; // Reset to opposite side
            positions[i * 3 + 2] = (Math.random() - 0.5) * 100; // New random depth
          }
          if (
            positions[i * 3 + 1] > boundary ||
            positions[i * 3 + 1] < -boundary
          ) {
            positions[i * 3 + 1] = -Math.sign(positions[i * 3 + 1]) * boundary;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
          }
          if (
            positions[i * 3 + 2] > boundary ||
            positions[i * 3 + 2] < -boundary
          ) {
            positions[i * 3 + 2] = -Math.sign(positions[i * 3 + 2]) * boundary;
          }
        }
        particleSystem.geometry.attributes.position.needsUpdate = true; // Important!

        // Rotate the whole particle system for a global dynamic effect
        particleSystem.rotation.y += 0.0002;
        particleSystem.rotation.x += 0.0001;

        // Camera movement based on mouse (subtle effect)
        camera.position.x += (mouseX - camera.position.x) * 0.001;
        camera.position.y += (-mouseY - camera.position.y) * 0.001; // Inverted Y
        camera.lookAt(scene.position); // Always look at the center of the scene

        // Render the scene
        renderer.render(scene, camera);
      }

      // --- Event Handlers ---
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Update pixel ratio on resize
      }

      // --- Start ---
      // Ensure the DOM is fully loaded before initializing Three.js

      setTimeout(() => {
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", init);
        } else {
          init();
        }
      }, 7000);
    </script>
  </body>
</html>
