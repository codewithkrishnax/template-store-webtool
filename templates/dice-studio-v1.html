<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Challenge Dice 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-variant: #334155;
  --border: #475569;
  --text: #f8fafc;
  --sub: #cbd5e1;
  --primary: #ef4444;
  --primary-soft: rgba(239, 68, 68, 0.2);
  --on-primary: #ffffff;
  --dice-bg: #ef4444;
  --dice-dot: #ffffff;
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

html, body { 
  height: 100dvh; overflow: hidden; 
  background: var(--bg); font-family: var(--sans); color: var(--text); 
}

.app {
  display: flex; flex-direction: column; height: 100dvh;
  max-width: 600px; margin: 0 auto; position: relative;
}

/* ── Floating Top Controls ── */
.float-btn {
  position: absolute; width: 48px; height: 48px; border-radius: 16px;
  background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;
  color: #fff; cursor: pointer; transition: transform 0.2s, background 0.2s; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.float-btn:active { transform: scale(0.9); background: rgba(30, 41, 59, 0.9); }
.float-btn svg { width: 22px; height: 22px; fill: currentColor; }
.btn-settings { top: max(20px, env(safe-area-inset-top)); right: 20px; }

/* ── 3D Dice Stage ── */
.stage {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  perspective: 1200px; position: relative; padding-bottom: 80px;
}

.dice {
  width: 160px; height: 160px; position: relative;
  transform-style: preserve-3d; transition: transform 2.5s cubic-bezier(0.1, 0.8, 0.2, 1);
  transform: rotateX(-15deg) rotateY(15deg); cursor: pointer;
}
.dice:active { transition: transform 0.2s; transform: rotateX(-15deg) rotateY(15deg) scale(0.9); }

.face {
  position: absolute; width: 100%; height: 100%; background: var(--dice-bg);
  border: 4px solid rgba(0,0,0,0.1); border-radius: 24px; box-shadow: inset 0 0 40px rgba(0,0,0,0.2);
  display: grid; padding: 24px;
}
/* Face Positions */
.front  { transform: rotateY(0deg) translateZ(80px); }
.back   { transform: rotateY(180deg) translateZ(80px); }
.right  { transform: rotateY(90deg) translateZ(80px); }
.left   { transform: rotateY(-90deg) translateZ(80px); }
.top    { transform: rotateX(90deg) translateZ(80px); }
.bottom { transform: rotateX(-90deg) translateZ(80px); }

/* Dot Layouts (CSS Grid Magic) */
.dot { width: 24px; height: 24px; background: var(--dice-dot); border-radius: 50%; box-shadow: inset 0 4px 8px rgba(0,0,0,0.3); }

/* Grid configurations for 1 to 6 */
.face-1 { place-items: center; }
.face-2 { grid-template-columns: 1fr 1fr; align-items: space-between; }
.face-2 .dot:nth-child(2) { justify-self: end; align-self: end; }
.face-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.face-3 .dot:nth-child(1) { grid-area: 1 / 1; }
.face-3 .dot:nth-child(2) { grid-area: 2 / 2; justify-self: center; align-self: center; }
.face-3 .dot:nth-child(3) { grid-area: 3 / 3; justify-self: end; align-self: end; }
.face-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.face-4 .dot:nth-child(even) { justify-self: end; }
.face-4 .dot:nth-child(3), .face-4 .dot:nth-child(4) { align-self: end; }
.face-5 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.face-5 .dot:nth-child(1) { grid-area: 1 / 1; }
.face-5 .dot:nth-child(2) { grid-area: 1 / 3; justify-self: end; }
.face-5 .dot:nth-child(3) { grid-area: 2 / 2; justify-self: center; align-self: center; }
.face-5 .dot:nth-child(4) { grid-area: 3 / 1; align-self: end; }
.face-5 .dot:nth-child(5) { grid-area: 3 / 3; justify-self: end; align-self: end; }
.face-6 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); }
.face-6 .dot:nth-child(even) { justify-self: end; }
.face-6 .dot:nth-child(3), .face-6 .dot:nth-child(4) { align-self: center; }
.face-6 .dot:nth-child(5), .face-6 .dot:nth-child(6) { align-self: end; }

/* Custom Text Layout */
.custom-text {
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; color: var(--dice-dot);
  text-align: center; line-height: 1.1; word-wrap: break-word; text-transform: uppercase;
}

/* ── Result Display ── */
.result-display {
  position: absolute; bottom: 120px; font-size: 28px; font-weight: 900; color: var(--text);
  opacity: 0; transform: translateY(20px); transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  text-shadow: 0 4px 12px rgba(0,0,0,0.5); text-align: center; padding: 0 20px;
}
.result-display.show { opacity: 1; transform: translateY(0); }

/* ── Bottom Action Bar ── */
.bottom-bar {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px calc(24px + var(--safe-b));
  background: linear-gradient(to top, var(--bg) 50%, transparent); z-index: 20; display: flex;
}
.btn-roll {
  flex: 1; height: 72px; border-radius: 24px; background: var(--primary); color: #fff;
  border: none; display: flex; justify-content: center; align-items: center; gap: 12px; cursor: pointer;
  font-family: var(--sans); font-size: 22px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
  box-shadow: 0 8px 32px var(--primary-soft), inset 0 4px 0 rgba(255,255,255,0.2); transition: transform 0.1s, box-shadow 0.1s;
}
.btn-roll:active { transform: scale(0.96) translateY(4px); box-shadow: 0 4px 16px var(--primary-soft), inset 0 0px 0 rgba(255,255,255,0.2); }
.btn-roll svg { width: 28px; height: 28px; fill: currentColor; }

/* ── Bottom Sheet (Settings) ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 30;
}
.overlay.active { opacity: 1; pointer-events: auto; }

.bottom-sheet {
  position: fixed; bottom: 0; left: 0; width: 100%; max-height: 90dvh;
  background: var(--surface); border-radius: 32px 32px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
  z-index: 40; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column;
}
.bottom-sheet.active { transform: translateY(0); }

.sheet-handle { width: 48px; height: 6px; background: var(--border); border-radius: 4px; margin: 16px auto 0; }
.sheet-header { padding: 16px 24px; font-size: 20px; font-weight: 800; color: var(--text); border-bottom: 1px solid var(--border); }
.sheet-body { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }

/* Controls */
.control-group { display: flex; flex-direction: column; gap: 12px; }
.control-title { font-size: 14px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; }

.color-row { display: flex; gap: 12px; }
.color-picker-wrap {
  flex: 1; display: flex; align-items: center; justify-content: space-between;
  background: var(--surface-variant); border-radius: 16px; padding: 12px 16px;
}
.color-picker-wrap span { font-size: 14px; font-weight: 700; color: var(--text); }
input[type="color"] {
  -webkit-appearance: none; border: none; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; background: none; padding: 0;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 10px; }

/* Toggle */
.toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface-variant); padding: 16px; border-radius: 16px; cursor: pointer; }
.toggle-info { display: flex; flex-direction: column; gap: 4px; }
.toggle-title { font-size: 15px; font-weight: 800; color: var(--text); }
.toggle-sub { font-size: 13px; font-weight: 600; color: var(--sub); }
.toggle-switch {
  width: 52px; height: 30px; background: var(--border); border-radius: 15px;
  position: relative; transition: background 0.25s; flex-shrink: 0;
}
.toggle-switch::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  background: #fff; border-radius: 50%; transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
input[type="checkbox"] { display: none; }
input[type="checkbox"]:checked + .toggle-switch { background: var(--primary); }
input[type="checkbox"]:checked + .toggle-switch::after { transform: translateX(22px); }

/* Text Inputs */
.custom-texts-wrap { display: none; flex-direction: column; gap: 12px; }
.custom-texts-wrap.active { display: flex; animation: fadeIn 0.3s; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

.input-row { display: flex; align-items: center; gap: 12px; }
.input-num { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-variant); color: var(--sub); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0;}
.input-field {
  flex: 1; background: var(--surface-variant); border: 2px solid transparent; border-radius: 12px;
  padding: 14px 16px; font-family: var(--sans); font-size: 15px; font-weight: 700; color: var(--text); outline: none; transition: border 0.2s;
}
.input-field:focus { border-color: var(--primary); }

</style>
</head>
<body>
<div class="app">

  <button class="float-btn btn-settings" onclick="openSettings()">
    <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
  </button>

  <div class="stage">
    <div class="dice" id="dice" onclick="rollDice()">
      <div class="face front face-1" id="f-1"></div>
      <div class="face bottom face-2" id="f-2"></div>
      <div class="face right face-3" id="f-3"></div>
      <div class="face left face-4" id="f-4"></div>
      <div class="face top face-5" id="f-5"></div>
      <div class="face back face-6" id="f-6"></div>
    </div>
    <div class="result-display" id="result-display">Ready!</div>
  </div>

  <div class="bottom-bar">
    <button class="btn-roll" onclick="rollDice()" id="btn-roll">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Roll Dice
    </button>
  </div>

</div>

<!-- Settings Sheet -->
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">Dice Studio Config</div>
  
  <div class="sheet-body">
    <div class="control-group">
      <div class="control-title">Aesthetics</div>
      <div class="color-row">
        <div class="color-picker-wrap">
          <span>Dice Body</span>
          <input type="color" id="color-body" value="#ef4444" oninput="updateColors()">
        </div>
        <div class="color-picker-wrap">
          <span>Dots / Text</span>
          <input type="color" id="color-dot" value="#ffffff" oninput="updateColors()">
        </div>
      </div>
    </div>

    <div class="control-group">
      <div class="control-title">Content Mode</div>
      <label class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-title">Custom Challenge Text</div>
          <div class="toggle-sub">Replace dots with your own words</div>
        </div>
        <input type="checkbox" id="toggle-text" onchange="toggleTextMode()">
        <div class="toggle-switch"></div>
      </label>
    </div>

    <div class="custom-texts-wrap" id="custom-texts">
      <div class="input-row"><div class="input-num">1</div><input type="text" class="input-field t-input" value="Spicy" maxlength="12" placeholder="Face 1 Text"></div>
      <div class="input-row"><div class="input-num">2</div><input type="text" class="input-field t-input" value="Sweet" maxlength="12" placeholder="Face 2 Text"></div>
      <div class="input-row"><div class="input-num">3</div><input type="text" class="input-field t-input" value="Sour" maxlength="12" placeholder="Face 3 Text"></div>
      <div class="input-row"><div class="input-num">4</div><input type="text" class="input-field t-input" value="Salty" maxlength="12" placeholder="Face 4 Text"></div>
      <div class="input-row"><div class="input-num">5</div><input type="text" class="input-field t-input" value="Bitter" maxlength="12" placeholder="Face 5 Text"></div>
      <div class="input-row"><div class="input-num">6</div><input type="text" class="input-field t-input" value="Skip" maxlength="12" placeholder="Face 6 Text"></div>
    </div>

  </div>
</div>

<script>
// --- State ---
const dice = document.getElementById('dice');
const resultDisplay = document.getElementById('result-display');
const btnRoll = document.getElementById('btn-roll');
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');

let currentX = -15; 
let currentY = 15;
let isRolling = false;
let isTextMode = false;

// --- Initialize Faces ---
function renderFaces() {
  const inputs = document.querySelectorAll('.t-input');
  
  for(let i=1; i<=6; i++) {
    const faceEl = document.getElementById(`f-${i}`);
    faceEl.innerHTML = '';
    
    if (isTextMode) {
      faceEl.className = `face custom-text`;
      // Maintain base transform classes based on index mapping
      if(i===1) faceEl.classList.add('front');
      if(i===2) faceEl.classList.add('bottom');
      if(i===3) faceEl.classList.add('right');
      if(i===4) faceEl.classList.add('left');
      if(i===5) faceEl.classList.add('top');
      if(i===6) faceEl.classList.add('back');
      
      const val = inputs[i-1].value.trim() || i.toString();
      faceEl.innerHTML = `<span>${val}</span>`;
    } else {
      faceEl.className = `face face-${i}`;
      if(i===1) faceEl.classList.add('front');
      if(i===2) faceEl.classList.add('bottom');
      if(i===3) faceEl.classList.add('right');
      if(i===4) faceEl.classList.add('left');
      if(i===5) faceEl.classList.add('top');
      if(i===6) faceEl.classList.add('back');

      for(let d=0; d<i; d++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        faceEl.appendChild(dot);
      }
    }
  }
}
renderFaces(); // Initial render

// --- Settings Logic ---
function openSettings() {
  overlay.classList.add('active');
  sheet.classList.add('active');
}
function closeSettings() {
  overlay.classList.remove('active');
  sheet.classList.remove('active');
  if(isTextMode) renderFaces(); // Refresh text if changed
}

function updateColors() {
  const body = document.getElementById('color-body').value;
  const dot = document.getElementById('color-dot').value;
  document.documentElement.style.setProperty('--dice-bg', body);
  document.documentElement.style.setProperty('--dice-dot', dot);
}

function toggleTextMode() {
  isTextMode = document.getElementById('toggle-text').checked;
  const wrap = document.getElementById('custom-texts');
  if(isTextMode) wrap.classList.add('active');
  else wrap.classList.remove('active');
  renderFaces();
}

// --- Roll Mechanics (Affine Rotation Engine) ---
function rollDice() {
  if (isRolling) return;
  isRolling = true;
  
  // Haptic feedback
  if(navigator.vibrate) navigator.vibrate([50, 100, 50]);
  
  resultDisplay.classList.remove('show');
  btnRoll.style.opacity = '0.5';
  btnRoll.style.pointerEvents = 'none';

  // Base Randomization
  const result = Math.floor(Math.random() * 6) + 1;
  
  // Add 4 to 6 full spins to ensure wild animation
  const spinsX = (Math.floor(Math.random() * 3) + 4) * 360; 
  const spinsY = (Math.floor(Math.random() * 3) + 4) * 360;

  // Calculate new absolute target base
  let targetX = currentX + spinsX;
  let targetY = currentY + spinsY;

  // Snap to nearest 360 to align cleanly
  targetX = targetX - (targetX % 360);
  targetY = targetY - (targetY % 360);

  // Apply final face offset based on CSS structure
  switch(result) {
    case 1: targetX += 0; targetY += 0; break;     // Front
    case 2: targetX += 90; targetY += 0; break;    // Bottom
    case 3: targetX += 0; targetY += -90; break;   // Right
    case 4: targetX += 0; targetY += 90; break;    // Left
    case 5: targetX += -90; targetY += 0; break;   // Top
    case 6: targetX += 180; targetY += 0; break;   // Back
  }

  currentX = targetX;
  currentY = targetY;

  // Execute animation
  dice.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

  // Wait for CSS transition (2.5s)
  setTimeout(() => {
    isRolling = false;
    btnRoll.style.opacity = '1';
    btnRoll.style.pointerEvents = 'auto';
    
    if(navigator.vibrate) navigator.vibrate(100);
    
    // Show Result
    let resText = result.toString();
    if(isTextMode) {
      const inputs = document.querySelectorAll('.t-input');
      resText = inputs[result-1].value.trim() || result.toString();
    }
    resultDisplay.textContent = resText;
    resultDisplay.classList.add('show');

  }, 2600);
}
</script>
</body>
</html>
