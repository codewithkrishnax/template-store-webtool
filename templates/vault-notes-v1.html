<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Vault Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f4f4f8;
  --surface: #ffffff;
  --surface-variant: #f1f5f9;
  --border: rgba(0,0,0,0.06);
  --text: #18181b;
  --sub: #71717a;
  --muted: #a1a1aa;
  --primary: #0ea5e9;
  --primary-soft: #e0f2fe;
  --on-primary: #ffffff;
  --danger: #ef4444;
  --danger-soft: #fee2e2;
  --warn: #f59e0b;
  --warn-soft: #fef3c7;
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
  --radius: 20px;
  --shadow: 0 4px 16px rgba(0,0,0,0.05);
  --sheet-shadow: 0 -8px 24px rgba(0,0,0,0.1);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

[data-theme="dark"] {
  --bg: #09090b;
  --surface: #18181b;
  --surface-variant: #27272a;
  --border: rgba(255,255,255,0.08);
  --text: #fafafa;
  --sub: #a1a1aa;
  --muted: #71717a;
  --primary: #38bdf8;
  --primary-soft: rgba(56, 189, 248, 0.15);
  --on-primary: #082f49;
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.15);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.15);
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --sheet-shadow: 0 -8px 30px rgba(0,0,0,0.7);
}

html, body { 
  height: 100dvh; overflow: hidden; 
  background: var(--bg); font-family: var(--sans); color: var(--text); 
  transition: background 0.3s, color 0.3s;
}

.app {
  display: flex; flex-direction: column; height: 100dvh;
  max-width: 600px; margin: 0 auto; position: relative;
}

/* ── Header ── */
.header { 
  display: flex; align-items: center; justify-content: space-between; 
  flex-shrink: 0; padding: 16px 20px; background: var(--bg); z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-icon {
  width: 42px; height: 42px; border-radius: 14px; background: var(--primary);
  display: flex; align-items: center; justify-content: center; color: var(--on-primary);
  box-shadow: 0 4px 12px var(--primary-soft);
}
.header-icon svg { width: 22px; height: 22px; fill: currentColor; }
.header-text h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
.header-text p { font-size: 13px; color: var(--sub); font-weight: 600; margin-top: 1px; }

.theme-toggle {
  width: 42px; height: 42px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: transform 0.2s;
  box-shadow: var(--shadow);
}
.theme-toggle:active { transform: scale(0.9); }
.theme-toggle svg { width: 20px; height: 20px; fill: currentColor; }
.icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: block; }

/* ── Workspace ── */
.workspace {
  flex: 1; overflow-y: auto; scrollbar-width: none; 
  padding: 8px 20px calc(100px + var(--safe-b));
}
.workspace::-webkit-scrollbar { display: none; }

/* ── Empty State ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; gap: 16px; transition: opacity 0.3s;
}
.empty-state.hidden { display: none; }
.empty-icon { width: 80px; height: 80px; background: var(--surface); border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--primary); box-shadow: var(--shadow); }
.empty-icon svg { width: 36px; height: 36px; fill: currentColor; }
.empty-title { font-size: 18px; font-weight: 800; color: var(--text); }
.empty-sub { font-size: 14px; color: var(--sub); text-align: center; max-width: 260px; line-height: 1.5; font-weight: 500; }

/* ── Notes Grid (Masonry) ── */
.notes-grid {
  column-count: 2; column-gap: 12px;
}
@media (min-width: 500px) { .notes-grid { column-count: 3; } }

.note-card {
  background: var(--surface); border-radius: 18px; padding: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  margin-bottom: 12px; break-inside: avoid; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden;
  animation: fadeUp 0.3s ease forwards;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.note-card:active { transform: scale(0.96); }

.note-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note-excerpt { font-size: 13px; color: var(--sub); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.note-date { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 12px; }

/* Locked Note Overlay */
.note-card.locked {
  background: var(--surface-variant); border: 1px dashed var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; text-align: center;
}
.locked-icon { width: 32px; height: 32px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.locked-icon svg { width: 16px; height: 16px; fill: currentColor; }
.locked-text { font-size: 13px; font-weight: 700; color: var(--sub); }

/* ── FAB ── */
.fab {
  position: absolute; bottom: calc(24px + var(--safe-b)); right: 24px;
  width: 58px; height: 58px; border-radius: 20px;
  background: var(--primary); color: var(--on-primary);
  display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 24px var(--primary-soft);
  border: none; cursor: pointer; transition: transform 0.2s; z-index: 20;
}
.fab:active { transform: scale(0.92); }
.fab svg { width: 24px; height: 24px; fill: currentColor; }

/* ── Bottom Sheets ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 30;
}
.overlay.active { opacity: 1; pointer-events: auto; }

.bottom-sheet {
  position: fixed; bottom: 0; left: 0; width: 100%; max-height: 90dvh;
  background: var(--bg); border-radius: 28px 28px 0 0; box-shadow: var(--sheet-shadow);
  z-index: 40; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column;
}
.bottom-sheet.active { transform: translateY(0); }

.sheet-handle { width: 44px; height: 5px; background: var(--border); border-radius: 3px; margin: 12px auto 0; }

/* Editor Sheet */
#editor-sheet { height: 90dvh; }
.editor-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.editor-btn {
  width: 40px; height: 40px; border-radius: 12px; background: transparent; border: none;
  display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer; transition: background 0.2s;
}
.editor-btn:active { background: var(--surface-variant); }
.editor-btn svg { width: 20px; height: 20px; fill: currentColor; }

.editor-actions { display: flex; gap: 8px; }
.btn-lock { color: var(--warn); background: var(--warn-soft); }
.btn-lock.locked { color: var(--surface); background: var(--warn); }
.btn-del { color: var(--danger); background: var(--danger-soft); }

.editor-body {
  flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 12px; overflow-y: auto;
}
.edit-title {
  width: 100%; font-size: 22px; font-weight: 800; font-family: var(--sans); color: var(--text);
  background: transparent; border: none; outline: none; padding: 0;
}
.edit-title::placeholder { color: var(--muted); }

.edit-content {
  flex: 1; width: 100%; font-size: 16px; font-family: var(--sans); font-weight: 500; color: var(--sub); line-height: 1.6;
  background: transparent; border: none; outline: none; padding: 0; resize: none; min-height: 150px;
}
.edit-content::placeholder { color: var(--muted); }

/* PIN Sheet */
#pin-sheet { padding: 0 24px calc(24px + var(--safe-b)); }
.pin-header { text-align: center; padding: 24px 0 16px; }
.pin-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.pin-sub { font-size: 14px; font-weight: 500; color: var(--sub); }

.pin-input-wrap {
  background: var(--surface); border: 2px solid var(--border); border-radius: 16px;
  height: 64px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; transition: border 0.2s;
}
.pin-input-wrap:focus-within { border-color: var(--primary); }
.pin-input {
  width: 100%; background: transparent; border: none; outline: none; text-align: center;
  font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: 8px; font-family: monospace;
}

.pin-actions { display: flex; gap: 12px; }
.btn-pin {
  flex: 1; height: 54px; border-radius: 14px; font-family: var(--sans); font-size: 16px; font-weight: 700;
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s;
}
.btn-pin:active { transform: scale(0.96); }
.btn-pin-cancel { background: var(--surface-variant); color: var(--text); }
.btn-pin-submit { background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 14px var(--primary-soft); }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translate(-50%, -20px);
  background-color: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700;
  opacity: 0; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 100; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.toast.show { transform: translate(-50%, 20px); opacity: 1; }
</style>
</head>
<body>
<div class="app">

 
  <div class="workspace">
    <!-- Empty State -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></div>
      <div class="empty-title">Your Vault is Empty</div>
      <div class="empty-sub">Tap the + button to create a new secure note.</div>
    </div>

    <!-- Notes Grid -->
    <div class="notes-grid" id="notes-grid">
      <!-- Generated by JS -->
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openEditor()">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
</div>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeSheets()"></div>

<!-- Editor Sheet -->
<div class="bottom-sheet" id="editor-sheet">
  <div class="sheet-handle"></div>
  <div class="editor-header">
    <button class="editor-btn" onclick="saveAndCloseEditor()">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
    </button>
    <div class="editor-actions">
      <button class="editor-btn btn-del" id="btn-delete" onclick="deleteCurrentNote()">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
      <button class="editor-btn btn-lock" id="btn-lock" onclick="handleLockAction()">
        <svg id="icon-unlocked" viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/></svg>
        <svg id="icon-locked" style="display:none" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </button>
    </div>
  </div>
  <div class="editor-body">
    <input type="text" id="note-title" class="edit-title" placeholder="Title" autocomplete="off">
    <textarea id="note-content" class="edit-content" placeholder="Write something private..."></textarea>
  </div>
</div>

<!-- PIN Sheet -->
<div class="bottom-sheet" id="pin-sheet">
  <div class="sheet-handle"></div>
  <div class="pin-header">
    <div class="pin-title" id="pin-title">Enter PIN</div>
    <div class="pin-sub" id="pin-sub">Enter your 4-digit code to unlock.</div>
  </div>
  <div class="pin-input-wrap">
    <input type="password" id="pin-input" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
  </div>
  <div class="pin-actions">
    <button class="btn-pin btn-pin-cancel" onclick="closePinSheet()">Cancel</button>
    <button class="btn-pin btn-pin-submit" onclick="submitPin()">Confirm</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- Theme Logic ---
function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
}
initTheme();

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const target = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', target);
  localStorage.setItem('theme', target);
}

// --- Toast ---
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// --- IndexedDB Setup ---
const DB_NAME = 'vault_notes_db';
const STORE = 'notes';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = e => {
      e.target.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
    };
    request.onsuccess = () => { db = request.result; resolve(); };
    request.onerror = () => reject(request.error);
  });
}

function storeTx(mode) {
  return db.transaction(STORE, mode).objectStore(STORE);
}
function dbGetAll() {
  return new Promise((res, rej) => {
    const req = storeTx('readonly').getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbPut(note) {
  return new Promise((res, rej) => {
    const req = storeTx('readwrite').put(note);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbDelete(id) {
  return new Promise((res, rej) => {
    const req = storeTx('readwrite').delete(id);
    req.onsuccess = () => res();
    req.onerror = () => rej(req.error);
  });
}

// --- App State ---
let notes = [];
let currentNote = null; // Holds the note currently being edited
let pinContext = null;  // Used to manage PIN flow: { action: 'unlock'|'set'|'remove', noteId?: number }

// --- Render Grid ---
function formatDate(ts) {
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

async function loadNotes() {
  notes = await dbGetAll();
  notes.sort((a, b) => b.updatedAt - a.updatedAt);
  
  const grid = document.getElementById('notes-grid');
  const emptyState = document.getElementById('empty-state');
  
  if (notes.length === 0) {
    grid.innerHTML = '';
    emptyState.classList.remove('hidden');
    return;
  }
  
  emptyState.classList.add('hidden');
  grid.innerHTML = notes.map(note => {
    if (note.pin) {
      return `
        <div class="note-card locked" onclick="initiateUnlock(${note.id})">
          <div class="locked-icon"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></div>
          <div class="locked-text">Locked Note</div>
        </div>
      `;
    }
    
    // Normal Note
    const titleHtml = note.title ? `<div class="note-title">${note.title}</div>` : '';
    const contentPreview = note.content || 'Empty note...';
    
    return `
      <div class="note-card" onclick="openEditor(${note.id})">
        ${titleHtml}
        <div class="note-excerpt">${contentPreview}</div>
        <div class="note-date">${formatDate(note.updatedAt)}</div>
      </div>
    `;
  }).join('');
}

// --- Sheets Management ---
const overlay = document.getElementById('overlay');
const editorSheet = document.getElementById('editor-sheet');
const pinSheet = document.getElementById('pin-sheet');
const pinInput = document.getElementById('pin-input');

function closeSheets() {
  overlay.classList.remove('active');
  editorSheet.classList.remove('active');
  pinSheet.classList.remove('active');
  document.activeElement.blur();
}

// --- Editor ---
function openEditor(id = null) {
  if (id !== null) {
    currentNote = notes.find(n => n.id === id);
  } else {
    currentNote = { title: '', content: '', pin: null };
  }
  
  document.getElementById('note-title').value = currentNote.title || '';
  document.getElementById('note-content').value = currentNote.content || '';
  
  document.getElementById('btn-delete').style.display = id ? 'flex' : 'none';
  
  updateLockIconUI();

  overlay.classList.add('active');
  editorSheet.classList.add('active');
  pinSheet.classList.remove('active'); // ensure pin sheet is closed
}

async function saveAndCloseEditor() {
  const title = document.getElementById('note-title').value.trim();
  const content = document.getElementById('note-content').value.trim();
  
  if (!title && !content && !currentNote.id) {
    // Empty new note, just discard
    closeSheets();
    return;
  }

  currentNote.title = title;
  currentNote.content = content;
  currentNote.updatedAt = Date.now();
  if (!currentNote.createdAt) currentNote.createdAt = currentNote.updatedAt;

  await dbPut(currentNote);
  currentNote = null;
  closeSheets();
  loadNotes();
}

async function deleteCurrentNote() {
  if (currentNote && currentNote.id) {
    await dbDelete(currentNote.id);
    showToast("Note deleted");
  }
  currentNote = null;
  closeSheets();
  loadNotes();
}

// --- Security / PIN Flow ---
function updateLockIconUI() {
  const lockBtn = document.getElementById('btn-lock');
  if (currentNote.pin) {
    lockBtn.classList.add('locked');
    document.getElementById('icon-unlocked').style.display = 'none';
    document.getElementById('icon-locked').style.display = 'block';
  } else {
    lockBtn.classList.remove('locked');
    document.getElementById('icon-unlocked').style.display = 'block';
    document.getElementById('icon-locked').style.display = 'none';
  }
}

function handleLockAction() {
  if (currentNote.pin) {
    // Already locked -> prompt to remove PIN
    openPinPrompt({ action: 'remove', correctPin: currentNote.pin }, "Remove PIN", "Enter current PIN to unlock permanently.");
  } else {
    // Not locked -> prompt to set PIN
    openPinPrompt({ action: 'set' }, "Set PIN", "Create a 4-digit code to lock this note.");
  }
}

function initiateUnlock(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  openPinPrompt({ action: 'unlock', noteId: id, correctPin: note.pin }, "Unlock Note", "Enter your 4-digit code to view.");
}

function openPinPrompt(context, title, subtitle) {
  pinContext = context;
  document.getElementById('pin-title').textContent = title;
  document.getElementById('pin-sub').textContent = subtitle;
  pinInput.value = '';
  
  overlay.classList.add('active');
  // If coming from editor, hide it behind overlay, show pin sheet
  pinSheet.classList.add('active');
  pinInput.focus();
}

function closePinSheet() {
  pinSheet.classList.remove('active');
  pinInput.value = '';
  // If we were inside the editor (adding/removing pin), the overlay should stay active
  if (editorSheet.classList.contains('active')) {
    // Keep overlay
  } else {
    overlay.classList.remove('active');
  }
}

function submitPin() {
  const val = pinInput.value.trim();
  if (val.length < 4) {
    showToast("Enter a 4-digit PIN");
    return;
  }

  if (pinContext.action === 'unlock') {
    if (val === pinContext.correctPin) {
      closePinSheet();
      openEditor(pinContext.noteId);
    } else {
      showToast("Incorrect PIN");
      pinInput.value = '';
    }
  } 
  else if (pinContext.action === 'set') {
    currentNote.pin = val;
    updateLockIconUI();
    showToast("Note Locked");
    closePinSheet();
  } 
  else if (pinContext.action === 'remove') {
    if (val === pinContext.correctPin) {
      currentNote.pin = null;
      updateLockIconUI();
      showToast("Lock Removed");
      closePinSheet();
    } else {
      showToast("Incorrect PIN");
      pinInput.value = '';
    }
  }
}

// Auto-submit pin when 4 digits entered
pinInput.addEventListener('input', () => {
  if (pinInput.value.length === 4) {
    submitPin();
  }
});

// --- Boot ---
openDB().then(loadNotes).catch(e => {
  showToast("Database error: Works best outside private browsing.");
});

</script>
</body>
