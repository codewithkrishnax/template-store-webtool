<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* iOS Calculator Theme */
  --c-bg: #000000;
  --c-text: #ffffff;
  --c-btn-num: #333333;
  --c-btn-num-active: #737373;
  --c-btn-op: #ff9f0a;
  --c-btn-op-active: #fcc773;
  --c-btn-top: #a5a5a5;
  --c-btn-top-active: #d9d9d9;
  
  /* Vault Theme */
  --v-bg: #0f172a;
  --v-surface: #1e293b;
  --v-surface-variant: #334155;
  --v-border: #475569;
  --v-text: #f8fafc;
  --v-sub: #cbd5e1;
  --v-primary: #10b981;
  --v-danger: #ef4444;

  --sans: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 20px);
}

html, body { 
  height: 100dvh; overflow: hidden; 
  background: var(--c-bg); font-family: var(--sans); color: var(--c-text); 
}

.app {
  display: flex; flex-direction: column; height: 100dvh;
  max-width: 500px; margin: 0 auto; position: relative;
  background: var(--c-bg);
}

/* =========================================
   CALCULATOR UI (STEALTH MODE)
   ========================================= */
.calc-view {
  flex: 1; display: flex; flex-direction: column;
  padding: 0 16px calc(16px + var(--safe-b));
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s;
}
.calc-view.hidden { transform: scale(0.95); opacity: 0; pointer-events: none; position: absolute; inset: 0; }

.calc-display {
  flex: 1; display: flex; align-items: flex-end; justify-content: flex-end;
  padding: 20px 10px; font-size: 84px; font-weight: 300; line-height: 1;
  overflow: hidden; white-space: nowrap; font-variant-numeric: tabular-nums;
}

.calc-keypad {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-top: 10px;
}

.c-btn {
  aspect-ratio: 1/1; border-radius: 50%; border: none; outline: none;
  font-family: inherit; font-size: 34px; font-weight: 400; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background-color 0.1s; user-select: none; -webkit-tap-highlight-color: transparent;
}
.c-btn.zero { grid-column: span 2; aspect-ratio: auto; border-radius: 100px; justify-content: flex-start; padding-left: 30px; }

.c-btn.num { background: var(--c-btn-num); color: var(--c-text); }
.c-btn.num:active { background: var(--c-btn-num-active); }

.c-btn.op { background: var(--c-btn-op); color: var(--c-text); font-size: 42px; padding-bottom: 4px; }
.c-btn.op:active { background: var(--c-btn-op-active); }
.c-btn.op.active { background: var(--c-text); color: var(--c-btn-op); }

.c-btn.top { background: var(--c-btn-top); color: #000; font-size: 28px; }
.c-btn.top:active { background: var(--c-btn-top-active); }

/* =========================================
   VAULT UI (SECRET NOTES)
   ========================================= */
.vault-view {
  position: absolute; inset: 0; background: var(--v-bg); color: var(--v-text);
  display: flex; flex-direction: column; z-index: 50;
  transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.vault-view.active { transform: translateY(0); }

.v-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--safe-t) 20px 16px;
  background: var(--v-surface); border-bottom: 1px solid var(--v-border); z-index: 10;
}
.v-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.v-title svg { width: 22px; height: 22px; fill: var(--v-primary); }

.btn-lock {
  width: 40px; height: 40px; border-radius: 12px; background: rgba(239, 68, 68, 0.15); color: var(--v-danger);
  border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;
}
.btn-lock:active { transform: scale(0.9); }
.btn-lock svg { width: 20px; height: 20px; fill: currentColor; }

.v-workspace {
  flex: 1; overflow-y: auto; scrollbar-width: none; padding: 16px 20px calc(120px + var(--safe-b));
  display: flex; flex-direction: column; gap: 12px;
}
.v-workspace::-webkit-scrollbar { display: none; }

/* Note Cards */
.note-card {
  background: var(--v-surface); border: 1px solid var(--v-border); border-radius: 16px;
  padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}
.note-card:active { transform: scale(0.97); background: var(--v-surface-variant); }
.note-text { font-size: 15px; color: var(--v-text); line-height: 1.5; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.note-date { font-size: 12px; color: var(--v-sub); font-weight: 600; margin-top: 4px; }

/* FAB */
.fab {
  position: absolute; bottom: calc(24px + var(--safe-b)); right: 24px;
  width: 60px; height: 60px; border-radius: 20px; background: var(--v-primary); color: #000;
  display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
  border: none; cursor: pointer; transition: transform 0.2s; z-index: 60;
}
.fab:active { transform: scale(0.92); }
.fab svg { width: 26px; height: 26px; fill: currentColor; }

/* =========================================
   NOTE EDITOR OVERLAY
   ========================================= */
.editor-overlay {
  position: absolute; inset: 0; background: var(--v-bg); z-index: 70;
  display: flex; flex-direction: column; transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.editor-overlay.active { transform: translateY(0); }

.ed-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--safe-t) 16px 12px; background: var(--v-surface); border-bottom: 1px solid var(--v-border);
}
.ed-btn {
  padding: 8px 16px; border-radius: 12px; font-family: var(--sans); font-size: 15px; font-weight: 700;
  border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: transform 0.2s;
}
.ed-btn:active { transform: scale(0.95); }
.btn-back { background: transparent; color: var(--v-text); }
.btn-back svg { width: 20px; height: 20px; fill: currentColor; }
.btn-save { background: var(--v-primary); color: #000; }

.ed-actions { display: flex; gap: 8px; padding: 12px 16px; background: var(--v-surface); border-bottom: 1px solid var(--v-border); }
.ed-icon-btn {
  width: 40px; height: 40px; border-radius: 10px; background: var(--v-surface-variant);
  border: none; display: flex; align-items: center; justify-content: center; color: var(--v-sub);
  cursor: pointer; transition: background 0.2s;
}
.ed-icon-btn:active { transform: scale(0.9); }
.ed-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
.ed-icon-btn.del { color: var(--v-danger); background: rgba(239, 68, 68, 0.1); }
.ed-icon-btn.del:active { background: rgba(239, 68, 68, 0.2); }

.ed-body { flex: 1; display: flex; flex-direction: column; padding: 16px; }
.ed-textarea {
  flex: 1; width: 100%; background: transparent; border: none; outline: none;
  font-family: var(--sans); font-size: 16px; font-weight: 500; color: var(--v-text);
  resize: none; line-height: 1.6;
}
.ed-textarea::placeholder { color: var(--v-sub); }

/* =========================================
   SETUP OVERLAY
   ========================================= */
.setup-overlay {
  position: absolute; inset: 0; background: var(--v-bg); z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center; color: var(--v-text); transition: opacity 0.3s;
}
.setup-overlay.hidden { opacity: 0; pointer-events: none; }
.setup-icon { width: 72px; height: 72px; background: var(--v-surface); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.setup-icon svg { width: 36px; height: 36px; fill: var(--v-primary); }
.setup-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.setup-sub { font-size: 15px; color: var(--v-sub); line-height: 1.5; margin-bottom: 32px; }

.pin-display {
  width: 100%; height: 64px; background: var(--v-surface); border: 2px solid var(--v-border);
  border-radius: 16px; font-size: 32px; font-family: monospace; font-weight: 800; letter-spacing: 12px;
  display: flex; align-items: center; justify-content: center; margin-bottom: 24px; color: var(--v-primary);
}

.setup-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 300px; }
.sk-btn {
  aspect-ratio: 1/1; border-radius: 50%; background: var(--v-surface-variant); border: none;
  font-size: 24px; font-weight: 700; color: var(--v-text); cursor: pointer; transition: transform 0.1s;
}
.sk-btn:active { transform: scale(0.9); background: var(--v-border); }
.sk-btn.sk-action { background: transparent; color: var(--v-sub); font-size: 16px; }
.sk-btn.sk-submit { background: var(--v-primary); color: #000; }

/* Empty State */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 12px; color: var(--v-sub); text-align: center; }
.empty-state svg { width: 48px; height: 48px; opacity: 0.5; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translate(-50%, -20px);
  background-color: var(--v-text); color: var(--v-bg); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700;
  opacity: 0; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 200; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.toast.show { transform: translate(-50%, 20px); opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <!-- ================= CALCULATOR (STEALTH) ================= -->
  <div class="calc-view" id="calc-view">
    <div class="calc-display" id="calc-display">0</div>
    <div class="calc-keypad">
      <button class="c-btn top" onclick="calcAction('clear')" id="calc-clear">AC</button>
      <button class="c-btn top" onclick="calcAction('sign')">±</button>
      <button class="c-btn top" onclick="calcAction('percent')">%</button>
      <button class="c-btn op" id="op-/" onclick="calcAction('operator', '/')">÷</button>

      <button class="c-btn num" onclick="calcAction('number', '7')">7</button>
      <button class="c-btn num" onclick="calcAction('number', '8')">8</button>
      <button class="c-btn num" onclick="calcAction('number', '9')">9</button>
      <button class="c-btn op" id="op-*" onclick="calcAction('operator', '*')">×</button>

      <button class="c-btn num" onclick="calcAction('number', '4')">4</button>
      <button class="c-btn num" onclick="calcAction('number', '5')">5</button>
      <button class="c-btn num" onclick="calcAction('number', '6')">6</button>
      <button class="c-btn op" id="op--" onclick="calcAction('operator', '-')">−</button>

      <button class="c-btn num" onclick="calcAction('number', '1')">1</button>
      <button class="c-btn num" onclick="calcAction('number', '2')">2</button>
      <button class="c-btn num" onclick="calcAction('number', '3')">3</button>
      <button class="c-btn op" id="op-+" onclick="calcAction('operator', '+')">+</button>

      <button class="c-btn num zero" onclick="calcAction('number', '0')">0</button>
      <button class="c-btn num" onclick="calcAction('decimal', '.')">.</button>
      <button class="c-btn op" onclick="calcAction('equals', '=')">=</button>
    </div>
  </div>

  <!-- ================= VAULT LIST ================= -->
  <div class="vault-view" id="vault-view">
    <div class="v-header">
      <div class="v-title">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        Secret Vault
      </div>
      <button class="btn-lock" onclick="lockVault()">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </button>
    </div>
    
    <div class="v-workspace" id="v-workspace">
      <!-- Injected by JS -->
    </div>

    <button class="fab" onclick="openEditor(null)">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>

  <!-- ================= NOTE EDITOR ================= -->
  <div class="editor-overlay" id="editor-overlay">
    <div class="ed-header">
      <button class="ed-btn btn-back" onclick="closeEditor()">
        <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg> Back
      </button>
      <button class="ed-btn btn-save" onclick="saveNote()">Save Note</button>
    </div>
    <div class="ed-actions">
      <button class="ed-icon-btn" onclick="pasteNote()" title="Paste">
        <svg viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
      </button>
      <button class="ed-icon-btn" onclick="copyNote()" title="Copy">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
      <button class="ed-icon-btn del" id="btn-delete-note" onclick="deleteNote()" style="margin-left:auto;" title="Delete">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
    </div>
    <div class="ed-body">
      <textarea class="ed-textarea" id="note-input" placeholder="Type a secret note..."></textarea>
    </div>
  </div>

  <!-- ================= FIRST TIME SETUP ================= -->
  <div class="setup-overlay hidden" id="setup-overlay">
    <div class="setup-icon"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg></div>
    <div class="setup-title">Setup Secret Vault</div>
    <div class="setup-sub">Enter a 4-8 digit PIN. Later, type this PIN in the calculator and press "=" to unlock.</div>
    
    <div class="pin-display" id="setup-pin-display"></div>
    
    <div class="setup-keypad">
      <button class="sk-btn" onclick="setupInput('1')">1</button>
      <button class="sk-btn" onclick="setupInput('2')">2</button>
      <button class="sk-btn" onclick="setupInput('3')">3</button>
      <button class="sk-btn" onclick="setupInput('4')">4</button>
      <button class="sk-btn" onclick="setupInput('5')">5</button>
      <button class="sk-btn" onclick="setupInput('6')">6</button>
      <button class="sk-btn" onclick="setupInput('7')">7</button>
      <button class="sk-btn" onclick="setupInput('8')">8</button>
      <button class="sk-btn" onclick="setupInput('9')">9</button>
      <button class="sk-btn sk-action" onclick="setupInput('del')">DEL</button>
      <button class="sk-btn" onclick="setupInput('0')">0</button>
      <button class="sk-btn sk-submit" onclick="setupSubmit()">
        <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:currentColor;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      </button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// --- Toast ---
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// --- IndexedDB ---
const DB_NAME = 'secret_calc_db';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 2);
    request.onupgradeneeded = e => {
      const dbInstance = e.target.result;
      if(!dbInstance.objectStoreNames.contains('config')) {
        dbInstance.createObjectStore('config', { keyPath: 'key' });
      }
      if(!dbInstance.objectStoreNames.contains('notes')) {
        dbInstance.createObjectStore('notes', { keyPath: 'id' });
      }
    };
    request.onsuccess = () => { db = request.result; resolve(); };
    request.onerror = () => reject(request.error);
  });
}

function dbAction(storeName, mode, action, data) {
  return new Promise((res, rej) => {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    let req;
    if(action === 'get') req = store.get(data);
    else if(action === 'getAll') req = store.getAll();
    else if(action === 'put') req = store.put(data);
    else if(action === 'delete') req = store.delete(data);
    
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

// --- App State ---
let secretPin = null;
let vaultOpen = false;

// --- Init ---
openDB().then(async () => {
  const config = await dbAction('config', 'readonly', 'get', 'pin');
  secretPin = config ? config.value : null;
  if (!secretPin) {
    document.getElementById('setup-overlay').classList.remove('hidden');
  }
}).catch(e => {
  showToast("Storage error: disable private browsing.");
});

// --- First Time Setup ---
let setupPinStr = "";
const setupDisplay = document.getElementById('setup-pin-display');

function setupInput(val) {
  if (val === 'del') {
    setupPinStr = setupPinStr.slice(0, -1);
  } else {
    if (setupPinStr.length < 8) setupPinStr += val;
  }
  setupDisplay.textContent = setupPinStr.replace(/./g, '•');
}

async function setupSubmit() {
  if (setupPinStr.length < 4) {
    showToast("PIN must be 4-8 digits");
    return;
  }
  await dbAction('config', 'readwrite', 'put', { key: 'pin', value: setupPinStr });
  secretPin = setupPinStr;
  document.getElementById('setup-overlay').classList.add('hidden');
  showToast("Vault Setup Complete");
}

// --- Stealth Calculator Engine ---
const calc = {
  displayValue: '0',
  firstOperand: null,
  waitingForSecondOperand: false,
  operator: null,
};

function updateDisplay() {
  const display = document.getElementById('calc-display');
  // Format to prevent overflow
  let out = calc.displayValue;
  if(out.length > 9 && !out.includes('e')) {
    out = parseFloat(out).toPrecision(9).replace(/0+$/, '').replace(/\.$/, '');
  }
  display.textContent = out;
}

function clearActiveOp() {
  document.querySelectorAll('.c-btn.op').forEach(btn => btn.classList.remove('active'));
}

function calcAction(type, value) {
  if (vaultOpen) return;

  // PIN Unlock Trigger
  if (type === 'equals' && calc.displayValue === secretPin) {
    unlockVault();
    calc.displayValue = '0';
    calc.firstOperand = null;
    calc.waitingForSecondOperand = false;
    calc.operator = null;
    clearActiveOp();
    updateDisplay();
    document.getElementById('calc-clear').textContent = 'AC';
    return;
  }

  if (type === 'number') {
    if (calc.waitingForSecondOperand) {
      calc.displayValue = value;
      calc.waitingForSecondOperand = false;
    } else {
      calc.displayValue = calc.displayValue === '0' ? value : calc.displayValue + value;
    }
    clearActiveOp();
  }
  else if (type === 'decimal') {
    if (calc.waitingForSecondOperand) {
      calc.displayValue = '0.';
      calc.waitingForSecondOperand = false;
    } else if (!calc.displayValue.includes('.')) {
      calc.displayValue += '.';
    }
  }
  else if (type === 'operator') {
    const inputValue = parseFloat(calc.displayValue);
    
    if (calc.operator && calc.waitingForSecondOperand) {
      calc.operator = value;
      clearActiveOp();
      document.getElementById('op-' + value).classList.add('active');
      return;
    }
    
    if (calc.firstOperand == null && !isNaN(inputValue)) {
      calc.firstOperand = inputValue;
    } else if (calc.operator) {
      const result = calculate(calc.firstOperand, inputValue, calc.operator);
      calc.displayValue = `${parseFloat(result.toFixed(7))}`;
      calc.firstOperand = result;
    }
    
    calc.waitingForSecondOperand = true;
    calc.operator = value;
    clearActiveOp();
    document.getElementById('op-' + value).classList.add('active');
  }
  else if (type === 'equals') {
    const inputValue = parseFloat(calc.displayValue);
    if (calc.operator && calc.waitingForSecondOperand) {
      calc.operator = null;
      calc.waitingForSecondOperand = false;
    } else if (calc.operator) {
      const result = calculate(calc.firstOperand, inputValue, calc.operator);
      calc.displayValue = `${parseFloat(result.toFixed(7))}`;
      calc.firstOperand = null;
      calc.operator = null;
      calc.waitingForSecondOperand = false;
    }
    clearActiveOp();
  }
  else if (type === 'clear') {
    calc.displayValue = '0';
    calc.firstOperand = null;
    calc.waitingForSecondOperand = false;
    calc.operator = null;
    clearActiveOp();
  }
  else if (type === 'sign') {
    calc.displayValue = (parseFloat(calc.displayValue) * -1).toString();
  }
  else if (type === 'percent') {
    calc.displayValue = (parseFloat(calc.displayValue) / 100).toString();
  }

  document.getElementById('calc-clear').textContent = calc.displayValue === '0' ? 'AC' : 'C';
  updateDisplay();
}

function calculate(first, second, operator) {
  if (operator === '+') return first + second;
  if (operator === '-') return first - second;
  if (operator === '*') return first * second;
  if (operator === '/') return first / second;
  return second;
}

// --- Vault Logic (CRUD) ---
let notesList = [];
let currentNoteId = null;

function unlockVault() {
  vaultOpen = true;
  document.getElementById('calc-view').classList.add('hidden');
  document.getElementById('vault-view').classList.add('active');
  loadNotes();
}

function lockVault() {
  vaultOpen = false;
  closeEditor();
  document.getElementById('vault-view').classList.remove('active');
  document.getElementById('calc-view').classList.remove('hidden');
}

function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag]));
}

async function loadNotes() {
  notesList = await dbAction('notes', 'readonly', 'getAll');
  notesList.sort((a, b) => b.updatedAt - a.updatedAt);
  renderNotes();
}

function renderNotes() {
  const ws = document.getElementById('v-workspace');
  if (notesList.length === 0) {
    ws.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        <p>No secret notes yet.<br>Tap the + button to add one.</p>
      </div>`;
    return;
  }
  
  ws.innerHTML = notesList.map(n => `
    <div class="note-card" onclick="openEditor(${n.id})">
      <div class="note-text">${escapeHTML(n.text)}</div>
      <div class="note-date">${new Date(n.updatedAt).toLocaleString(undefined, {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'})}</div>
    </div>
  `).join('');
}

const editorOverlay = document.getElementById('editor-overlay');
const noteInput = document.getElementById('note-input');
const btnDeleteNote = document.getElementById('btn-delete-note');

function openEditor(id) {
  if (id) {
    const note = notesList.find(n => n.id === id);
    if(note) {
      currentNoteId = id;
      noteInput.value = note.text;
      btnDeleteNote.style.display = 'flex';
    }
  } else {
    currentNoteId = null;
    noteInput.value = '';
    btnDeleteNote.style.display = 'none';
  }
  editorOverlay.classList.add('active');
  setTimeout(() => noteInput.focus(), 300);
}

function closeEditor() {
  editorOverlay.classList.remove('active');
  document.activeElement.blur();
}

async function saveNote() {
  const text = noteInput.value.trim();
  if(!text) {
    if(currentNoteId) { await deleteNote(); return; } // Emptying deletes it
    closeEditor();
    return;
  }
  
  const id = currentNoteId || Date.now(); // Guaranteed unique ID
  const note = { id: id, text: text, updatedAt: Date.now() };
  
  await dbAction('notes', 'readwrite', 'put', note);
  
  showToast(currentNoteId ? "Note updated" : "Note saved");
  closeEditor();
  loadNotes();
}

async function deleteNote() {
  if (!currentNoteId) return;
  await dbAction('notes', 'readwrite', 'delete', currentNoteId);
  showToast("Note deleted");
  closeEditor();
  loadNotes();
}

async function pasteNote() {
  try {
    const text = await navigator.clipboard.readText();
    noteInput.value += (noteInput.value ? '\n' : '') + text;
  } catch (err) {
    showToast("Clipboard access denied");
  }
}

async function copyNote() {
  try {
    await navigator.clipboard.writeText(noteInput.value);
    showToast("Copied to clipboard!");
  } catch (err) {
    showToast("Failed to copy");
  }
}

</script>
