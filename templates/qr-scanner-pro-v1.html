<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
            background-color: #f3f4f6;
        }
        .app-container {
            height: 100dvh; 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Force the video feed to cover the container beautifully */
        #reader video {
            object-fit: cover !important;
            min-height: 100%;
            min-width: 100%;
        }
        /* Hide the default messy UI of the library */
        #reader__dashboard_section_csr,
        #reader__dashboard_section_swaplink {
            display: none !important;
        }
    </style>
</head>
<body class="font-sans antialiased overflow-hidden flex justify-center text-gray-900">

    <div class="app-container flex flex-col w-full max-w-md bg-white border-x border-gray-200 shadow-2xl relative">
        
        <header class="flex items-center justify-between px-5 py-4 border-b border-gray-100 shrink-0 bg-white z-10 shadow-sm">
            <div class="flex items-center gap-2">
                <i class="ph-fill ph-scan text-2xl text-gray-900"></i>
                <div>
                    <h1 class="text-base font-bold tracking-tight text-gray-900 leading-none">Scanner Pro</h1>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mt-0.5">Barcode & QR Reader</p>
                </div>
            </div>
            <div id="status-indicator" class="flex items-center gap-1.5 px-2 py-1 bg-gray-100 rounded-full">
                <div class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse" id="status-dot"></div>
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest" id="status-text">Starting</span>
            </div>
        </header>

        <main class="flex-1 flex flex-col p-5 overflow-hidden bg-gray-50/50 relative">
            
            <div class="flex-1 flex flex-col bg-black rounded-2xl overflow-hidden relative shadow-lg">
                
                <div id="reader" class="w-full h-full flex items-center justify-center bg-gray-900"></div>
                
                <div id="scanner-overlay" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center z-10">
                    <div class="w-56 h-56 border-2 border-white/30 rounded-3xl relative">
                        <div class="absolute -top-1 -left-1 w-8 h-8 border-t-4 border-l-4 border-white rounded-tl-2xl"></div>
                        <div class="absolute -top-1 -right-1 w-8 h-8 border-t-4 border-r-4 border-white rounded-tr-2xl"></div>
                        <div class="absolute -bottom-1 -left-1 w-8 h-8 border-b-4 border-l-4 border-white rounded-bl-2xl"></div>
                        <div class="absolute -bottom-1 -right-1 w-8 h-8 border-b-4 border-r-4 border-white rounded-br-2xl"></div>
                        
                        <div class="absolute inset-x-4 top-1/2 h-0.5 bg-green-400 shadow-[0_0_10px_rgba(74,222,128,0.8)] animate-[scan_2s_ease-in-out_infinite]"></div>
                    </div>
                    <p class="text-white/90 text-xs font-bold uppercase tracking-widest mt-8 bg-black/60 px-5 py-2 rounded-full backdrop-blur-md">Align code in frame</p>
                </div>

                <div id="error-overlay" class="hidden absolute inset-0 bg-gray-900 z-20 flex flex-col items-center justify-center text-center p-6">
                    <i class="ph ph-camera-slash text-4xl text-gray-500 mb-3"></i>
                    <p class="text-sm font-bold text-white mb-2">Camera Access Required</p>
                    <p class="text-xs text-gray-400 mb-6">Please allow camera permissions in your browser settings to scan codes.</p>
                    <button onclick="startScanner()" class="px-5 py-2.5 bg-white text-black rounded-xl text-sm font-bold active:bg-gray-200 transition-colors">
                        Try Again
                    </button>
                </div>
            </div>

            <div id="scan-result-panel" class="hidden mt-4 bg-white border border-gray-200 rounded-2xl p-5 shadow-[0_10px_30px_rgba(0,0,0,0.05)] flex flex-col gap-4 animate-fade-in-up">
                
                <div class="flex items-start justify-between gap-3">
                    <div class="flex-1 min-w-0">
                        <span class="text-[10px] font-bold text-green-500 uppercase tracking-widest flex items-center gap-1 mb-1">
                            <i class="ph-fill ph-check-circle text-sm"></i> Code Detected
                        </span>
                        <p id="scan-result-text" class="text-sm font-semibold text-gray-900 break-words max-h-24 overflow-y-auto hide-scrollbar"></p>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="copyResult()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-900 rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5">
                        <i class="ph ph-copy text-lg"></i> Copy
                    </button>
                    <button onclick="openLink()" id="btn-open-link" class="hidden flex-1 py-3 bg-gray-900 hover:bg-gray-800 active:bg-gray-700 text-white rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1.5 shadow-md">
                        <i class="ph ph-arrow-square-out text-lg"></i> Open Link
                    </button>
                </div>

                <button onclick="restartScanner()" class="w-full py-2.5 border-2 border-dashed border-gray-200 hover:border-gray-300 active:bg-gray-50 text-gray-500 rounded-xl text-[11px] font-bold uppercase tracking-widest transition-colors mt-1">
                    Scan Another Code
                </button>
            </div>

        </main>

        <div id="toast" class="absolute bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs font-bold px-4 py-3 rounded-full opacity-0 pointer-events-none transition-opacity duration-300 z-50 shadow-lg flex items-center gap-2 whitespace-nowrap">
            <i class="ph-fill ph-check-circle text-sm text-green-400"></i> Copied to clipboard
        </div>

        <div class="pb-safe bg-white shrink-0"></div>
    </div>

    <style>
        @keyframes scan {
            0% { transform: translateY(-50px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(50px); opacity: 0; }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script>
        const DOM = {
            reader: document.getElementById('reader'),
            scannerOverlay: document.getElementById('scanner-overlay'),
            errorOverlay: document.getElementById('error-overlay'),
            
            resultPanel: document.getElementById('scan-result-panel'),
            resultText: document.getElementById('scan-result-text'),
            btnOpenLink: document.getElementById('btn-open-link'),
            
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text'),
            
            toast: document.getElementById('toast')
        };

        let html5QrCode = null;
        let isScanning = false;

        // Start scanning automatically on load
        document.addEventListener('DOMContentLoaded', () => {
            startScanner();
        });

        function updateStatus(state) {
            DOM.statusDot.className = 'w-2 h-2 rounded-full ' + 
                (state === 'active' ? 'bg-green-500 animate-pulse' : 
                 state === 'error' ? 'bg-red-500' : 
                 state === 'stopped' ? 'bg-gray-400' : 'bg-yellow-500 animate-pulse');
            
            DOM.statusText.textContent = 
                state === 'active' ? 'Scanning' : 
                state === 'error' ? 'Camera Error' : 
                state === 'stopped' ? 'Paused' : 'Starting';
        }

        function startScanner() {
            DOM.resultPanel.classList.add('hidden');
            DOM.errorOverlay.classList.add('hidden');
            DOM.scannerOverlay.classList.remove('hidden');
            updateStatus('starting');
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            // Prefer back camera
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 15, // Higher FPS for smoother mobile scanning
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText, decodedResult) => {
                    handleScanSuccess(decodedText);
                },
                (errorMessage) => {
                    // Ignored: fires on every frame that doesn't contain a QR code
                }
            ).then(() => {
                isScanning = true;
                updateStatus('active');
            }).catch((err) => {
                console.error("Camera error:", err);
                isScanning = false;
                updateStatus('error');
                DOM.scannerOverlay.classList.add('hidden');
                DOM.errorOverlay.classList.remove('hidden');
            });
        }

        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    updateStatus('stopped');
                    DOM.scannerOverlay.classList.add('hidden');
                }).catch(err => {
                    console.error("Failed to stop scanner", err);
                });
            }
        }

        function restartScanner() {
            startScanner();
        }

        function handleScanSuccess(text) {
            // Stop scanning to freeze the camera frame on success
            stopScanner();
            
            // Beep sound feedback (optional but good for mobile)
            if ('vibrate' in navigator) navigator.vibrate(50);
            
            // Update UI
            DOM.resultPanel.classList.remove('hidden');
            DOM.resultText.textContent = text;

            // Check if it's a URL to show the 'Open Link' button
            if (/^https?:\/\//i.test(text)) {
                DOM.btnOpenLink.classList.remove('hidden');
                DOM.btnOpenLink.classList.add('flex');
                DOM.btnOpenLink.dataset.url = text;
            } else {
                DOM.btnOpenLink.classList.add('hidden');
                DOM.btnOpenLink.classList.remove('flex');
            }
        }

        function openLink() {
            const url = DOM.btnOpenLink.dataset.url;
            if (url) window.open(url, '_blank', 'noopener,noreferrer');
        }

        async function copyResult() {
            const text = DOM.resultText.textContent;
            if (!text) return;
            
            try {
                await navigator.clipboard.writeText(text);
                showToast();
            } catch (err) {
                const tempInput = document.createElement("textarea");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast();
            }
        }

        function showToast() {
            DOM.toast.classList.remove('opacity-0');
            setTimeout(() => {
                DOM.toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
