<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Compressor PWA</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Light Theme */
      --bg: #f4f4f8;
      --surface: #ffffff;
      --surface-variant: #e4e4e7;
      --border: rgba(0,0,0,0.08);
      --text: #18181b;
      --sub: #71717a;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --on-primary: #ffffff;
      --error: #ef4444;
      --success: #16a34a;
      --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --sheet-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }

    [data-theme="dark"] {
      /* Dark Theme */
      --bg: #09090b;
      --surface: #18181b;
      --surface-variant: #27272a;
      --border: rgba(255,255,255,0.1);
      --text: #fafafa;
      --sub: #a1a1aa;
      --primary: #a78bfa;
      --primary-soft: rgba(167, 139, 250, 0.15);
      --on-primary: #1c192b;
      --error: #f87171;
      --success: #4ade80;
      --shadow: 0 4px 12px rgba(0,0,0,0.3);
      --sheet-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { 
      height: 100dvh; width: 100vw; overflow: hidden; 
      background: var(--bg); font-family: var(--sans); color: var(--text); 
      transition: background 0.3s, color 0.3s;
    }

    .app { display: flex; flex-direction: column; height: 100dvh; width: 100%; position: relative; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; padding: 0 16px; background: var(--surface);
      border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px; background: var(--primary);
      color: var(--on-primary); display: flex; align-items: center; justify-content: center;
    }
    .brand-icon svg { width: 18px; height: 18px; fill: currentColor; }
    .brand-text { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface-variant); border: none; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text); transition: transform 0.2s;
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
    
    .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: block; }

    /* ── Workspace ── */
    .workspace {
      flex: 1; padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
      padding-bottom: 120px; /* Clear FABs */
      scrollbar-width: none;
    }
    .workspace::-webkit-scrollbar { display: none; }

    /* Empty State */
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; color: var(--sub); opacity: 1; transition: opacity 0.3s;
    }
    .empty-state.hidden { display: none; }
    .empty-state-icon {
      width: 80px; height: 80px; border-radius: 50%; background: var(--surface-variant);
      display: flex; justify-content: center; align-items: center;
    }
    .empty-state-icon svg { width: 40px; height: 40px; fill: currentColor; opacity: 0.6; }
    .empty-state span { font-size: 16px; font-weight: 600; color: var(--text); }
    .empty-state p { font-size: 13px; text-align: center; max-width: 240px; line-height: 1.5; }

    /* File List Items */
    .file-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 12px; display: flex; align-items: center; gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      animation: slideIn 0.3s cubic-bezier(0.2, 0, 0, 1) backwards;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .file-thumb {
      width: 56px; height: 56px; border-radius: 12px; background: var(--surface-variant);
      overflow: hidden; flex-shrink: 0;
    }
    .file-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .file-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .file-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .file-stats { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
    .stat-arrow { width: 12px; height: 12px; fill: currentColor; opacity: 0.7; }
    .stat-new { color: var(--primary); font-weight: 600; }
    
    .file-savings { font-size: 11px; margin-top: 4px; font-weight: 600; }
    .savings-good { color: var(--success); }
    .savings-bad { color: var(--error); }

    .action-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--primary-soft); color: var(--primary); border: none;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; flex-shrink: 0; transition: transform 0.2s;
    }
    .action-btn:active { transform: scale(0.9); }
    .action-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* Processing Pulse */
    .processing-pulse {
      height: 16px; width: 75%; background: var(--surface-variant); border-radius: 4px; margin-bottom: 8px;
      animation: skeleton 1.5s infinite ease-in-out;
    }
    .processing-pulse.short { width: 40%; height: 12px; }
    @keyframes skeleton { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    
    .spinner { width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--sub); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Bottom Sheet (Settings) ── */
    .bottom-sheet {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: var(--surface); border-radius: 28px 28px 0 0;
      box-shadow: var(--sheet-shadow); z-index: 20;
      transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
      display: flex; flex-direction: column;
      padding: 16px 24px 32px;
    }
    .bottom-sheet.active { transform: translateY(0); }
    
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    .sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 24px; color: var(--text); }
    
    .control-group { margin-bottom: 24px; }
    .control-header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: var(--sub); margin-bottom: 12px; }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
      background: var(--primary); margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 4px; background: var(--surface-variant); border-radius: 2px;
    }
    
    .sheet-desc { font-size: 12px; color: var(--sub); line-height: 1.5; margin-bottom: 24px; }
    
    .btn-done {
      width: 100%; height: 50px; border: none; border-radius: 25px;
      background: var(--surface-variant); color: var(--text);
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      cursor: pointer; transition: transform 0.2s;
    }
    .btn-done:active { transform: scale(0.96); }

    /* ── Overlay ── */
    .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 19;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    /* ── FABs ── */
    .fab-group {
      position: absolute; bottom: 24px; right: 20px;
      display: flex; flex-direction: column; gap: 12px; align-items: flex-end; z-index: 15;
    }

    .fab {
      width: 56px; height: 56px; border-radius: 16px;
      background-color: var(--primary); color: var(--on-primary);
      display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 14px var(--primary-soft);
      border: none; cursor: pointer; transition: transform 0.2s;
    }
    .fab:active { transform: scale(0.92); }
    .fab svg { width: 24px; height: 24px; fill: currentColor; }
    
    .fab-dl-all {
      width: auto; padding: 0 20px; background: var(--surface); color: var(--primary);
      font-family: var(--sans); font-size: 15px; font-weight: 700;
      border: 1px solid var(--border); display: none; gap: 8px;
    }
    .fab-dl-all svg { width: 20px; height: 20px; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--primary-soft); } 70% { box-shadow: 0 0 0 16px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }
    .pulse { animation: pulse 2s infinite; }

    /* ── Toast ── */
    .toast {
      position: fixed; top: 80px; left: 50%; transform: translate(-50%, -20px);
      background-color: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600;
      opacity: 0; transition: all 0.3s cubic-bezier(0.2, 0, 0, 1); z-index: 100; pointer-events: none; white-space: nowrap;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM6 17l3-4 2.25 3 3-4L18 17H6z"/></svg>
        </div>
        <div class="brand-text">Compressor</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openSettings()" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
          <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7c.19 0 .38.02.57.04C11.02 6.55 10 8.65 10 11s1.02 4.45 2.57 5.96c-.19.02-.38.04-.57.04z"/></svg>
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace" id="workspace">
      <!-- Empty State -->
      <div class="empty-state" id="empty-state">
        <div class="empty-state-icon">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </div>
        <span>No images selected</span>
        <p>Tap the + button to select images to compress entirely offline.</p>
      </div>
    </div>

    <!-- FABs -->
    <div class="fab-group">
      <button class="fab fab-dl-all" id="btn-dl-all" onclick="downloadAll()">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Save All
      </button>
      <button class="fab pulse" id="btn-add" onclick="document.getElementById('file-input').click()">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </div>

    <input type="file" id="file-input" accept="image/*" multiple>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeSettings()"></div>

    <!-- Bottom Sheet (Settings) -->
    <div class="bottom-sheet" id="sheet-settings">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Compression Quality</div>
      
      <div class="control-group">
        <div class="control-header"><span>JPEG Quality</span> <span id="val-quality">70%</span></div>
        <input type="range" id="inp-quality" min="10" max="100" value="70">
      </div>
      
      <p class="sheet-desc">Lower quality results in a smaller file size but reduces image clarity. 70% is recommended for web use.</p>
      
      <button class="btn-done" onclick="closeSettings()">Done</button>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    // --- Theme Logic ---
    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    }
    initTheme();

    function toggleTheme() {
      const target = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('theme', target);
    }

    // --- State ---
    let selectedFiles = []; // { id, file, blob, status }
    let quality = 0.70;
    let isProcessing = false;
    let toastTimer;

    const fileInput = document.getElementById('file-input');
    const workspace = document.getElementById('workspace');
    const emptyState = document.getElementById('empty-state');
    const btnDlAll = document.getElementById('btn-dl-all');
    const btnAdd = document.getElementById('btn-add');
    
    // --- Settings Sheet ---
    const inpQuality = document.getElementById('inp-quality');
    const valQuality = document.getElementById('val-quality');

    inpQuality.addEventListener('input', (e) => {
      valQuality.textContent = `${e.target.value}%`;
      quality = parseInt(e.target.value) / 100;
    });

    function openSettings() {
      document.getElementById('overlay').classList.add('active');
      document.getElementById('sheet-settings').classList.add('active');
    }
    function closeSettings() {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('sheet-settings').classList.remove('active');
    }

    // --- Utility ---
    const formatBytes = (bytes) => {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    };

    const generateId = () => Math.random().toString(36).substring(2, 9);

    // --- File Handling & UI Rendering ---
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const newItems = files.map(file => ({
        id: generateId(),
        file: file,
        blob: null,
        status: 'pending'
      }));

      selectedFiles = [...selectedFiles, ...newItems];
      updateEmptyState();
      
      newItems.forEach(item => renderItem(item));

      if (!isProcessing) processFiles();
      
      fileInput.value = ''; // Reset
    });

    function updateEmptyState() {
      if (selectedFiles.length > 0) {
        emptyState.classList.add('hidden');
        btnAdd.classList.remove('pulse');
      }
    }

    function updateDlAllBtn() {
      const allDone = selectedFiles.length > 0 && selectedFiles.every(f => f.status === 'done' || f.status === 'error');
      btnDlAll.style.display = allDone ? 'flex' : 'none';
    }

    function renderItem(item) {
      let el = document.getElementById(`item-${item.id}`);
      const objectUrl = URL.createObjectURL(item.file);
      
      if (!el) {
        el = document.createElement('div');
        el.id = `item-${item.id}`;
        el.className = 'file-item';
        // Append before empty state to keep layout clean
        workspace.appendChild(el);
      }

      let contentHtml = '';
      
      if (item.status === 'processing') {
        contentHtml = `
          <div class="file-info">
            <div class="processing-pulse"></div>
            <div class="processing-pulse short"></div>
          </div>
          <div class="spinner"></div>
        `;
      } else if (item.status === 'done') {
        const savingsPercent = ((item.file.size - item.blob.size) / item.file.size * 100).toFixed(0);
        const isLarger = item.blob.size >= item.file.size;
        
        const savingsHtml = isLarger 
          ? `<div class="file-savings savings-bad">No reduction</div>` 
          : `<div class="file-savings savings-good">-${savingsPercent}% Smaller</div>`;
          
        contentHtml = `
          <div class="file-info">
            <div class="file-name">${item.file.name}</div>
            <div class="file-stats">
              <span style="text-decoration: line-through; opacity: 0.7;">${formatBytes(item.file.size)}</span>
              <svg class="stat-arrow" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
              <span class="stat-new">${formatBytes(item.blob.size)}</span>
            </div>
            ${savingsHtml}
          </div>
          <button class="action-btn" onclick="downloadSingle('${item.id}')">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          </button>
        `;
      }

      el.innerHTML = `
        <div class="file-thumb"><img src="${objectUrl}"></div>
        ${contentHtml}
      `;
    }

    // --- Core Canvas Compression ---
    function compressImage(file, q) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          
          canvas.width = img.width;
          canvas.height = img.height;
          
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error('Compression failed'));
          }, 'image/jpeg', q);
        };
        
        img.onerror = () => reject(new Error('Load failed'));
        img.src = objectUrl;
      });
    }

    async function processFiles() {
      isProcessing = true;
      for (let i = 0; i < selectedFiles.length; i++) {
        if (selectedFiles[i].status !== 'pending') continue;
        
        selectedFiles[i].status = 'processing';
        renderItem(selectedFiles[i]);
        
        try {
          await new Promise(r => setTimeout(r, 50)); // Render UI tick
          const blob = await compressImage(selectedFiles[i].file, quality);
          selectedFiles[i].blob = blob;
          selectedFiles[i].status = 'done';
        } catch (err) {
          selectedFiles[i].status = 'error';
        }
        
        renderItem(selectedFiles[i]);
        updateDlAllBtn();
      }
      isProcessing = false;
      if (selectedFiles.length > 0) showToast("Compression complete");
    }

    // --- Strict Programmatic Download ---
    function downloadSingle(id) {
      const item = selectedFiles.find(f => f.id === id);
      if (!item || !item.blob) return;
      
      const nameWithoutExt = item.file.name.substring(0, item.file.name.lastIndexOf('.')) || item.file.name;
      triggerDownload(item.blob, `${nameWithoutExt}_min.jpg`);
      showToast("Saved to device");
    }

    function downloadAll() {
      const completed = selectedFiles.filter(f => f.status === 'done');
      if (completed.length === 0) return;

      let delay = 0;
      completed.forEach(item => {
        setTimeout(() => {
          const nameWithoutExt = item.file.name.substring(0, item.file.name.lastIndexOf('.')) || item.file.name;
          triggerDownload(item.blob, `${nameWithoutExt}_min.jpg`);
        }, delay);
        delay += 300; // Staggered to prevent browser blocking multi-downloads
      });
      showToast(`Saving ${completed.length} images...`);
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
