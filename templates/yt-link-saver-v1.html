<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>YT Link Saver</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* LIGHT MODE (Default) */
  --bg: #f4f4f8;
  --surface: #ffffff;
  --surface-variant: #f1f5f9;
  --border: rgba(0,0,0,0.08);
  --text: #18181b;
  --sub: #71717a;
  --primary: #ef4444;
  --primary-soft: rgba(239, 68, 68, 0.15);
  --on-primary: #ffffff;
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, 0.15);
  --shadow: 0 4px 16px rgba(0,0,0,0.06);
  --safe-t: env(safe-area-inset-top, 16px);
  --safe-b: env(safe-area-inset-bottom, 16px);
  --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
}

[data-theme="dark"] {
  /* DARK MODE */
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-variant: #334155;
  --border: #475569;
  --text: #f8fafc;
  --sub: #cbd5e1;
  --primary: #ef4444;
  --primary-soft: rgba(239, 68, 68, 0.2);
  --on-primary: #ffffff;
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.15);
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
}

html, body { 
  height: 100dvh; overflow: hidden; 
  background: var(--bg); font-family: var(--sans); color: var(--text); 
  transition: background 0.3s, color 0.3s;
}

.app {
  display: flex; flex-direction: column; height: 100dvh;
  max-width: 600px; margin: 0 auto; position: relative;
}

/* ── Floating Top Controls (No Header) ── */
.float-controls {
  position: absolute; top: max(16px, var(--safe-t)); right: 16px;
  display: flex; gap: 12px; z-index: 20;
}
.float-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text); cursor: pointer; transition: transform 0.2s, background 0.3s;
  box-shadow: var(--shadow);
}
.float-btn:active { transform: scale(0.9); }
.float-btn svg { width: 20px; height: 20px; fill: currentColor; }

.icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: block; }

.icon-list { display: none; }
.view-list .icon-grid { display: none; }
.view-list .icon-list { display: block; }

/* ── Workspace ── */
.workspace {
  flex: 1; display: flex; flex-direction: column; gap: 16px;
  overflow-y: auto; scrollbar-width: none; background: var(--bg);
  padding: max(72px, var(--safe-t)) 16px calc(100px + var(--safe-b));
}
.workspace::-webkit-scrollbar { display: none; }

/* ── Search Bar ── */
.search-wrap {
  display: flex; align-items: center; background: var(--surface);
  border: 1px solid var(--border); border-radius: 16px; padding: 0 16px;
  height: 52px; box-shadow: var(--shadow); transition: border 0.2s;
  flex-shrink: 0;
}
.search-wrap:focus-within { border-color: var(--primary); }
.search-wrap svg { width: 20px; height: 20px; fill: var(--sub); flex-shrink: 0; }
.search-input {
  flex: 1; background: transparent; border: none; outline: none; padding: 0 12px;
  font-family: var(--sans); font-size: 15px; font-weight: 500; color: var(--text);
}
.search-input::placeholder { color: var(--sub); }

/* ── Empty State ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; gap: 16px; text-align: center; transition: opacity 0.3s; padding: 24px;
}
.empty-state.hidden { display: none; }
.empty-icon { width: 80px; height: 80px; background: var(--surface); border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--primary); box-shadow: var(--shadow); }
.empty-icon svg { width: 40px; height: 40px; fill: currentColor; }
.empty-title { font-size: 20px; font-weight: 800; color: var(--text); }
.empty-sub { font-size: 14px; color: var(--sub); line-height: 1.5; max-width: 280px; }

/* ── Video Container (Handles Grid & List modes) ── */
.video-container { display: flex; flex-direction: column; gap: 20px; }

.v-card {
  background: var(--surface); border-radius: 24px; overflow: hidden;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  display: flex; transition: transform 0.2s, background 0.3s;
  animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.v-thumb-wrap { background: #000; position: relative; cursor: pointer; flex-shrink: 0; }
.v-thumb { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; transition: opacity 0.2s; }
.v-thumb-wrap:active .v-thumb { opacity: 0.7; }
.play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.play-icon { width: 48px; height: 48px; background: rgba(0,0,0,0.6); border-radius: 50%; backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; color: #fff; border: 2px solid rgba(255,255,255,0.2); }
.play-icon svg { width: 22px; height: 22px; fill: currentColor; margin-left: 3px; }

.v-content { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.v-title { font-weight: 800; color: var(--text); overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.v-notes { font-weight: 500; color: var(--sub); overflow: hidden; text-overflow: ellipsis; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.v-notes.empty { font-style: italic; opacity: 0.6; }

.v-actions { display: flex; gap: 8px; }
.btn-action {
  flex: 1; border-radius: 12px; background: var(--surface-variant); color: var(--text);
  border: none; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
  font-family: var(--sans); font-weight: 700; transition: transform 0.2s, background 0.2s;
}
.btn-action:active { transform: scale(0.95); }
.btn-action svg { width: 16px; height: 16px; fill: currentColor; }
.btn-action.danger { color: var(--danger); }
.btn-action.danger:active { background: var(--danger-soft); }

/* --- GRID VIEW STYLES (Default) --- */
.video-container.view-grid .v-card { flex-direction: column; }
.video-container.view-grid .v-thumb-wrap { width: 100%; aspect-ratio: 16/9; }
.video-container.view-grid .v-content { padding: 16px; }
.video-container.view-grid .v-title { font-size: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.video-container.view-grid .v-notes { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.video-container.view-grid .v-actions { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
.video-container.view-grid .btn-action { height: 44px; font-size: 13px; }

/* --- LIST VIEW STYLES --- */
.video-container.view-list { gap: 12px; }
.video-container.view-list .v-card { flex-direction: row; height: 110px; border-radius: 16px; }
.video-container.view-list .v-thumb-wrap { width: 140px; height: 100%; }
.video-container.view-list .play-icon { width: 36px; height: 36px; }
.video-container.view-list .play-icon svg { width: 16px; height: 16px; }
.video-container.view-list .v-content { padding: 12px; gap: 4px; justify-content: center; }
.video-container.view-list .v-title { font-size: 14px; white-space: nowrap; }
.video-container.view-list .v-notes { font-size: 12px; white-space: nowrap; }
.video-container.view-list .v-actions { flex-direction: column; width: 44px; padding: 6px; border-left: 1px solid var(--border); }
.video-container.view-list .btn-action { height: 100%; border-radius: 8px; }
.video-container.view-list .btn-action span { display: none; } /* Hide text in list view */

/* ── FAB ── */
.fab {
  position: absolute; bottom: calc(24px + var(--safe-b)); right: 24px;
  width: 64px; height: 64px; border-radius: 20px;
  background: var(--primary); color: #fff;
  display: flex; justify-content: center; align-items: center; box-shadow: 0 8px 32px var(--primary-soft);
  border: none; cursor: pointer; transition: transform 0.2s; z-index: 20;
}
.fab:active { transform: scale(0.92); }
.fab svg { width: 30px; height: 30px; fill: currentColor; }

/* ── Bottom Sheet (Editor) ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 30;
}
.overlay.active { opacity: 1; pointer-events: auto; }

.bottom-sheet {
  position: fixed; bottom: 0; left: 0; width: 100%; max-height: 95dvh;
  background: var(--surface); border-radius: 32px 32px 0 0; box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
  z-index: 40; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex; flex-direction: column;
}
.bottom-sheet.active { transform: translateY(0); }

.sheet-handle { width: 48px; height: 6px; background: var(--border); border-radius: 4px; margin: 16px auto 0; }
.sheet-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; border-bottom: 1px solid var(--border);
}
.sheet-title { font-size: 18px; font-weight: 800; color: var(--text); }
.btn-close {
  width: 36px; height: 36px; border-radius: 50%; background: var(--surface-variant); border: none;
  display: flex; align-items: center; justify-content: center; color: var(--text); cursor: pointer; transition: transform 0.2s;
}
.btn-close:active { transform: scale(0.9); }
.btn-close svg { width: 20px; height: 20px; fill: currentColor; }

.sheet-body {
  flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px;
}

/* Input Fields */
.input-wrap { display: flex; flex-direction: column; gap: 8px; }
.input-label { font-size: 13px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.5px; }
.input-field {
  width: 100%; background: var(--surface-variant); border: 2px solid transparent; border-radius: 16px;
  padding: 16px; font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--text); outline: none; transition: border 0.2s;
}
.input-field:focus { border-color: var(--primary); }
.input-field::placeholder { color: var(--sub); font-weight: 500; opacity: 0.7; }
textarea.input-field { resize: none; min-height: 90px; line-height: 1.5; }

/* Thumbnail Preview Box */
.preview-box {
  width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden;
  border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center;
  position: relative;
}
.preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
.preview-placeholder { color: var(--sub); font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.preview-placeholder svg { width: 24px; height: 24px; fill: currentColor; }

.btn-save {
  width: 100%; height: 56px; border-radius: 16px; background: var(--primary); color: #fff;
  border: none; display: flex; justify-content: center; align-items: center; font-family: var(--sans); font-size: 16px; font-weight: 800;
  cursor: pointer; box-shadow: 0 8px 24px var(--primary-soft); transition: transform 0.2s; margin-top: 8px;
}
.btn-save:active { transform: scale(0.96); }

/* Toast */
.toast {
  position: fixed; top: max(20px, var(--safe-t)); left: 50%; transform: translate(-50%, -20px);
  background-color: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 700;
  opacity: 0; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 100; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  white-space: nowrap;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <!-- Floating Top Controls -->
  <div class="float-controls">
    <button class="float-btn btn-view" onclick="toggleView()" title="Toggle View">
      <svg class="icon-grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>
      <svg class="icon-list" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
    </button>
    <button class="float-btn btn-theme" onclick="toggleTheme()" title="Toggle Theme">
      <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7c.19 0 .38.02.57.04C11.02 6.55 10 8.65 10 11s1.02 4.45 2.57 5.96c-.19.02-.38.04-.57.04z"/></svg>
    </button>
  </div>

  <div class="workspace">
    <!-- Search Bar -->
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search saved links..." oninput="renderList()" autocomplete="off">
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></div>
      <div class="empty-title">No Links Found</div>
      <div class="empty-sub">Paste a YouTube link to automatically fetch its thumbnail and save it for later.</div>
    </div>

    <!-- Video List Container (Toggles classes view-grid / view-list) -->
    <div class="video-container view-grid" id="video-grid">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openEditor()">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
</div>

<!-- Editor Bottom Sheet -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="editor-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="editor-title">Save YouTube Link</div>
    <button class="btn-close" onclick="closeSheet()">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
    </button>
  </div>
  
  <div class="sheet-body">
    <div class="input-wrap">
      <span class="input-label">YouTube URL</span>
      <input type="text" id="f-url" class="input-field" placeholder="Paste link here..." autocomplete="off" oninput="handleUrlInput()">
    </div>

    <div class="preview-box" id="preview-box">
      <div class="preview-placeholder" id="preview-placeholder">
        <svg viewBox="0 0 24 24"><path d="M21 3H3C2 3 1 4 1 5v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zM8 15l7-4-7-4v8z"/></svg>
        <span>Preview will appear here</span>
      </div>
      <img id="preview-img" src="" alt="Thumbnail Preview" onerror="handleThumbError(this)">
    </div>

    <div class="input-wrap">
      <span class="input-label">Title</span>
      <input type="text" id="f-title" class="input-field" placeholder="Video title..." autocomplete="off">
    </div>

    <div class="input-wrap">
      <span class="input-label">Notes (Optional)</span>
      <textarea id="f-notes" class="input-field" placeholder="Why are you saving this?"></textarea>
    </div>

    <button class="btn-save" onclick="saveLink()">Save to Library</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- Theme Logic ---
function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}
initTheme();

function toggleTheme() {
  const isDark = document.documentElement.hasAttribute('data-theme');
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  }
}

// --- View Toggle Logic (Grid/List) ---
function initView() {
  const savedView = localStorage.getItem('viewMode') || 'view-grid';
  const grid = document.getElementById('video-grid');
  grid.className = `video-container ${savedView}`;
}
initView();

function toggleView() {
  const grid = document.getElementById('video-grid');
  if (grid.classList.contains('view-grid')) {
    grid.classList.remove('view-grid');
    grid.classList.add('view-list');
    localStorage.setItem('viewMode', 'view-list');
  } else {
    grid.classList.remove('view-list');
    grid.classList.add('view-grid');
    localStorage.setItem('viewMode', 'view-grid');
  }
}

// --- Toast ---
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// --- IndexedDB Setup ---
const DB_NAME = 'yt_saver_db';
const STORE = 'links';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = e => {
      e.target.result.createObjectStore(STORE, { keyPath: 'id' });
    };
    request.onsuccess = () => { db = request.result; resolve(); };
    request.onerror = () => reject(request.error);
  });
}

function dbAction(action, data) {
  return new Promise((res, rej) => {
    const mode = (action === 'get' || action === 'getAll') ? 'readonly' : 'readwrite';
    const tx = db.transaction(STORE, mode);
    const store = tx.objectStore(STORE);
    let req;
    
    if (action === 'get') req = store.get(data);
    else if (action === 'getAll') req = store.getAll();
    else if (action === 'put') req = store.put(data);
    else if (action === 'delete') req = store.delete(data);
    
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

// --- App State ---
let savedLinks = [];
let editingId = null;
let currentVideoId = null;

// --- Utilities ---
function escapeHTML(str) {
  return (str || '').replace(/[&<>'"]/g, tag => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  }[tag]));
}

// Regex to extract YouTube ID from ANY standard link
function extractVideoID(url) {
  const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/|youtube\.com\/shorts\/)([^"&?\/\s]{11})/i;
  const match = url.match(regExp);
  return (match && match[1]) ? match[1] : null;
}

// --- Core Logic ---
async function loadLinks() {
  savedLinks = await dbAction('getAll');
  savedLinks.sort((a, b) => b.updatedAt - a.updatedAt);
  renderList();
}

function renderList() {
  const grid = document.getElementById('video-grid');
  const emptyState = document.getElementById('empty-state');
  const searchInput = document.getElementById('search-input').value.toLowerCase();
  
  const filteredLinks = savedLinks.filter(item => {
    const titleMatch = (item.title || '').toLowerCase().includes(searchInput);
    const notesMatch = (item.notes || '').toLowerCase().includes(searchInput);
    return titleMatch || notesMatch;
  });
  
  if (filteredLinks.length === 0) {
    grid.innerHTML = '';
    emptyState.classList.remove('hidden');
    return;
  }
  
  emptyState.classList.add('hidden');
  
  grid.innerHTML = filteredLinks.map((item, idx) => {
    const thumbUrl = `https://img.youtube.com/vi/${item.videoId}/maxresdefault.jpg`;
    const notesHtml = item.notes ? escapeHTML(item.notes) : 'No notes added.';
    const notesClass = item.notes ? '' : 'empty';

    return `
      <div class="v-card" style="animation-delay: ${Math.min(idx * 0.05, 0.4)}s">
        <div class="v-thumb-wrap" onclick="window.open('${item.url}', '_blank')">
          <img src="${thumbUrl}" class="v-thumb" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${item.videoId}/hqdefault.jpg'">
          <div class="play-overlay">
            <div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
        </div>
        <div class="v-content" onclick="openEditor(${item.id})">
          <div class="v-title">${escapeHTML(item.title)}</div>
          <div class="v-notes ${notesClass}">${notesHtml}</div>
        </div>
        <div class="v-actions">
          <button class="btn-action" onclick="downloadThumb('${item.videoId}')" title="Download Thumbnail">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> <span>Thumb</span>
          </button>
          <button class="btn-action" onclick="openEditor(${item.id})" title="Edit">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> <span>Edit</span>
          </button>
          <button class="btn-action danger" onclick="deleteLink(${item.id})" title="Delete">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> <span>Delete</span>
          </button>
        </div>
      </div>
    `;
  }).join('');
}

// --- Thumbnail Download ---
async function downloadThumb(videoId) {
  const url = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
  try {
    const response = await fetch(url);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `yt_thumb_${videoId}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
    showToast("Thumbnail Downloaded!");
  } catch (error) {
    window.open(url, '_blank');
  }
}

// --- Editor Sheet ---
const overlay = document.getElementById('overlay');
const editorSheet = document.getElementById('editor-sheet');
const fUrl = document.getElementById('f-url');
const fTitle = document.getElementById('f-title');
const fNotes = document.getElementById('f-notes');
const previewImg = document.getElementById('preview-img');
const previewPlaceholder = document.getElementById('preview-placeholder');

function openEditor(id = null) {
  editingId = id;
  if (id) {
    const item = savedLinks.find(x => x.id === id);
    if (!item) return;
    document.getElementById('editor-title').textContent = 'Edit Link';
    fUrl.value = item.url;
    fTitle.value = item.title;
    fNotes.value = item.notes || '';
    currentVideoId = item.videoId;
    updatePreview(currentVideoId);
  } else {
    document.getElementById('editor-title').textContent = 'Save YouTube Link';
    fUrl.value = '';
    fTitle.value = '';
    fNotes.value = '';
    currentVideoId = null;
    updatePreview(null);
  }
  
  overlay.classList.add('active');
  editorSheet.classList.add('active');
}

function closeSheet() {
  overlay.classList.remove('active');
  editorSheet.classList.remove('active');
  document.activeElement.blur();
}

// --- Live Input Handling ---
function handleUrlInput() {
  const url = fUrl.value.trim();
  const id = extractVideoID(url);
  if (id && id !== currentVideoId) {
    currentVideoId = id;
    updatePreview(id);
  } else if (!id) {
    currentVideoId = null;
    updatePreview(null);
  }
}

function updatePreview(id) {
  if (id) {
    previewImg.src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
    previewImg.style.display = 'block';
    previewPlaceholder.style.display = 'none';
  } else {
    previewImg.src = '';
    previewImg.style.display = 'none';
    previewPlaceholder.style.display = 'flex';
  }
}

function handleThumbError(img) {
  if(img.src.includes('maxresdefault')) {
    img.src = img.src.replace('maxresdefault.jpg', 'hqdefault.jpg');
  }
}

// --- CRUD Operations ---
async function saveLink() {
  const url = fUrl.value.trim();
  const title = fTitle.value.trim();
  const notes = fNotes.value.trim();
  
  if (!url || !currentVideoId) { showToast("Valid YouTube URL required"); return; }
  if (!title) { showToast("Please enter a title"); return; }
  
  const linkItem = {
    id: editingId || Date.now(),
    url: url,
    videoId: currentVideoId,
    title: title,
    notes: notes,
    updatedAt: Date.now()
  };
  
  await dbAction('put', linkItem);
  showToast(editingId ? "Link Updated" : "Link Saved");
  closeSheet();
  loadLinks();
}

async function deleteLink(id) {
  await dbAction('delete', id);
  showToast("Link Deleted");
  loadLinks();
}

// --- Boot ---
openDB().then(loadLinks).catch(e => {
  showToast("Storage error. Disable private browsing.");
});
</script>
