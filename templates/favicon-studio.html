<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#F2F2F7">
    <title>Favicon Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* Native App Base Styles */
        :root {
            --bg-base: #F2F2F7; /* iOS grouped background */
            --bg-surface: #FFFFFF;
            --text-main: #000000;
            --text-muted: #8E8E93;
            --border-color: #C6C6C8;
            --accent: #007AFF; /* Native Blue */
            --danger: #FF3B30; /* Native Red */
            --radius-lg: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* Exact viewport height constraint */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* App Header */
        header {
            background-color: var(--bg-surface);
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 10;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
        }

        /* Scrollable Content Area */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Card Component */
        .card {
            background-color: var(--bg-surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            padding-left: 12px;
        }

        /* Image Upload Area */
        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            border: 2px dashed #D1D1D6;
            border-radius: var(--radius-lg);
            background-color: var(--bg-surface);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background-color 0.2s;
        }

        .upload-area:active {
            background-color: #E5E5EA;
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
            z-index: 2;
        }

        .upload-icon {
            width: 32px;
            height: 32px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
        }

        .upload-subtext {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .image-preview {
            width: 100%;
            height: 120px;
            object-fit: contain;
            display: none;
            z-index: 1;
        }

        /* Size Rows */
        .size-list {
            display: flex;
            flex-direction: column;
        }

        .size-row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #E5E5EA;
            gap: 12px;
        }

        .size-row:last-child {
            border-bottom: none;
        }

        .size-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #F2F2F7;
            border-radius: var(--radius-sm);
            padding: 4px 12px;
        }

        .size-input-wrapper input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            color: var(--text-main);
            text-align: center;
            padding: 8px 0;
            font-variant-numeric: tabular-nums;
        }

        .size-input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .cross-icon {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            padding: 0 8px;
        }

        .btn-remove {
            background: none;
            border: none;
            color: var(--danger);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-remove svg {
            width: 20px;
            height: 20px;
        }

        .btn-add {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px;
            color: var(--accent);
            font-size: 15px;
            font-weight: 600;
            background: none;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-add:active {
            background-color: #F2F2F7;
        }

        .btn-add svg {
            width: 18px;
            height: 18px;
        }

        /* Bottom Action Bar */
        .action-bar {
            background-color: var(--bg-surface);
            padding: 16px 20px 24px 20px; /* Extra bottom padding for safe area */
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .btn-export {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-export:active {
            opacity: 0.8;
        }

        .btn-export:disabled {
            background-color: #A1A1A6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">Favicon Studio</div>
    </header>

    <div class="content-scroll">
        
        <div>
            <div class="section-title">Source Image</div>
            <div class="upload-area" id="upload-area">
                <input type="file" id="file-input" accept="image/*">
                
                <div id="empty-state" style="text-align: center;">
                    <svg class="upload-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    <div class="upload-text">Choose Image</div>
                    <div class="upload-subtext">PNG, JPG, SVG allowed</div>
                </div>

                <img id="image-preview" class="image-preview" alt="Preview">
            </div>
        </div>

        <div>
            <div class="section-title">Export Sizes (px)</div>
            <div class="card">
                <div class="size-list" id="size-list">
                    </div>
                
                <button class="btn-add" onclick="addSizeRow('', '')">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    Add Custom Size
                </button>
            </div>
        </div>

    </div>

    <div class="action-bar">
        <button class="btn-export" id="btn-export" onclick="exportFavicons()">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            Export All as ZIP
        </button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const emptyState = document.getElementById('empty-state');
        const imagePreview = document.getElementById('image-preview');
        const sizeList = document.getElementById('size-list');
        const btnExport = document.getElementById('btn-export');
        
        let sourceImage = new Image();
        let isImageLoaded = false;

        // Standard Favicon Default Sizes
        const defaultSizes = [
            { w: 16, h: 16 },
            { w: 32, h: 32 },
            { w: 180, h: 180 },
            { w: 512, h: 512 }
        ];

        // Initialize UI with default sizes
        function init() {
            defaultSizes.forEach(size => addSizeRow(size.w, size.h));
        }

        // Handle Image Upload
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                
                sourceImage.onload = () => {
                    isImageLoaded = true;
                    // Update UI
                    emptyState.style.display = 'none';
                    imagePreview.src = url;
                    imagePreview.style.display = 'block';
                    document.getElementById('upload-area').style.padding = '12px';
                };
                sourceImage.src = url;
            }
        });

        // Add a new Size Row
        function addSizeRow(wVal, hVal) {
            const row = document.createElement('div');
            row.className = 'size-row';
            
            row.innerHTML = `
                <div class="size-input-wrapper">
                    <input type="number" class="input-w" placeholder="Width" value="${wVal}" min="1">
                </div>
                <div class="cross-icon">✕</div>
                <div class="size-input-wrapper">
                    <input type="number" class="input-h" placeholder="Height" value="${hVal}" min="1">
                </div>
                <button class="btn-remove" onclick="this.parentElement.remove()">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            `;
            sizeList.appendChild(row);
        }

        // Export Functionality using JSZip
        async function exportFavicons() {
            if (!isImageLoaded) {
                alert("Please upload a source image first.");
                return;
            }

            const rows = document.querySelectorAll('.size-row');
            if (rows.length === 0) {
                alert("Please add at least one size to export.");
                return;
            }

            // Update UI State
            const originalText = btnExport.innerHTML;
            btnExport.disabled = true;
            btnExport.innerHTML = "Processing...";

            const zip = new JSZip();
            const folder = zip.folder("favicons");
            let processedCount = 0;

            rows.forEach(row => {
                const w = parseInt(row.querySelector('.input-w').value);
                const h = parseInt(row.querySelector('.input-h').value);

                // Skip invalid rows
                if (!w || !h || w <= 0 || h <= 0) return;

                // Create offscreen canvas to resize image
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                
                // Draw image resized strictly to user dimensions
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(sourceImage, 0, 0, w, h);

                // Extract base64 data
                const dataUrl = canvas.toDataURL("image/png");
                const base64Data = dataUrl.split(',')[1];

                // Add to Zip
                folder.file(`favicon-${w}x${h}.png`, base64Data, {base64: true});
                processedCount++;
            });

            if (processedCount === 0) {
                alert("No valid sizes found. Please enter valid numbers.");
                btnExport.disabled = false;
                btnExport.innerHTML = originalText;
                return;
            }

            // Generate ZIP and trigger download
            zip.generateAsync({ type: "blob" }).then(function(content) {
                const url = URL.createObjectURL(content);
                const a = document.createElement("a");
                a.href = url;
                a.download = `Favicons_Export_${Date.now()}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                // Restore UI State
                btnExport.disabled = false;
                btnExport.innerHTML = originalText;
            }).catch(err => {
                alert("An error occurred while creating the ZIP file.");
                btnExport.disabled = false;
                btnExport.innerHTML = originalText;
            });
        }

        // Boot
        init();
    </script>
</body>
</html>
